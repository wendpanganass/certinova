function fnAssist(el){
  const t=el.value.slice(0,el.selectionStart);
  if(!t.startsWith("=")){ hideFnAssist(); return; }
  const m=/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9.]*)$/.exec(t);
  if(m&&!/["']/.test(t.slice(t.lastIndexOf(m[1])-1,t.lastIndexOf(m[1])))){
    const p=m[1].toUpperCase();
    const items=FN_DOCS.filter(d=>d[0].startsWith(p)).slice(0,12).map(d=>({n:d[0],d:d[3],k:"fn"}))
      .concat(Object.keys(X.wb.names).concat(Object.keys(X.wb.tables)).filter(n=>n.toUpperCase().startsWith(p)).map(n=>({n,d:"Nom défini",k:"name"})));
    if(items.length){ FA.items=items; FA.idx=0; FA.target=el; FA.prefix=m[1]; renderFA(el); }
    else hideFA();
  } else hideFA();
  // info-bulle de syntaxe
  let depth=0, fn=null, argi=0;
  for(let i=t.length-1;i>=0;i--){ const ch=t[i]; if(ch===")") depth++; else if(ch==="("){ if(depth===0){ const mm=/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9.]*)$/.exec(t.slice(0,i)); if(mm){ fn=mm[1].toUpperCase(); } break; } depth--; } else if((ch===";"||ch===",")&&depth===0) argi++; }
  const tip=FA.tip||(FA.tip=Object.assign(document.createElement("div"),{className:"fn-tip"}));
  const doc=fn&&(FN_DOC_MAP[fn]||FN_DOC_MAP[FN_ALIAS[fn]]);
  if(doc){ const sig=doc[2]; const inner=sig.slice(sig.indexOf("(")+1,sig.lastIndexOf(")")).split(";");
    tip.innerHTML=esc(doc[0])+"("+inner.map((a,i)=>i===Math.min(argi,inner.length-1)?`<span class="cur">${esc(a)}</span>`:esc(a)).join(";")+")";
    document.body.appendChild(tip); const r=el.getBoundingClientRect(); tip.style.left=r.left+"px"; tip.style.top=(r.bottom+2)+"px"; tip.hidden=false; }
  else tip.hidden=true;
}
function renderFA(){
  const el=FA.target; if(!FA.el){ FA.el=document.createElement("div"); FA.el.className="fn-ac"; document.body.appendChild(FA.el); }
  FA.el.hidden=false;
  FA.el.innerHTML=FA.items.map((it,i)=>`<div class="${i===FA.idx?"on":""}" data-i="${i}"><span class="fx">${it.k==="fn"?"fx":"▭"}</span><b>${esc(it.n)}</b></div>`).join("");
  const r=el.getBoundingClientRect(); FA.el.style.left=r.left+"px"; FA.el.style.top=(r.bottom+24)+"px";
  FA.el.querySelectorAll("div[data-i]").forEach(d=>d.onmousedown=ev=>{ ev.preventDefault(); FA.idx=+d.dataset.i; acceptFA(el); });
  if(!FA.desc){ FA.desc=document.createElement("div"); FA.desc.className="fn-desc"; document.body.appendChild(FA.desc); }
  const it=FA.items[FA.idx]; FA.desc.hidden=!it; if(it){ FA.desc.textContent=it.d; const rr=FA.el.getBoundingClientRect(); FA.desc.style.left=(rr.right+4)+"px"; FA.desc.style.top=rr.top+"px"; }
}
function acceptFA(el){
  const it=FA.items[FA.idx]; if(!it) return;
  const pos=el.selectionStart; const t=el.value; const start=pos-FA.prefix.length;
  const ins=it.n+(it.k==="fn"?"(":"");
  const nt=t.slice(0,start)+ins+t.slice(pos); el.value=nt; X.edit.text=nt; $("fbar").value=nt; const ed=$("cellEditor"); if(ed&&ed!==el) ed.value=nt;
  const np=start+ins.length; el.setSelectionRange(np,np); hideFA(); sizeEditor(); fnAssist(el);
}
function hideFA(){ if(FA.el) FA.el.hidden=true; if(FA.desc) FA.desc.hidden=true; }
function hideFnAssist(){ hideFA(); if(FA.tip) FA.tip.hidden=true; }

/* ---------- déplacements ---------- */
function moveAct(dr,dc,extend){
  const g=selG();
  if(!extend&&(g.r1!==g.r2||g.c1!==g.c2)&&!X.keyNav){ // déplacement dans la sélection (Entrée / Tab)
    let r=X.act.r+dr, c=X.act.c+dc;
    if(c>g.c2){ c=g.c1; r++; } if(c<g.c1){ c=g.c2; r--; } if(r>g.r2){ r=g.r1; c=(dc?c:c+1); if(c>g.c2) c=g.c1; } if(r<g.r1){ r=g.r2; }
    X.act={r,c}; paintSel(); updateFbar(); ensureVisible(r,c); return;
  }
  let r=X.act.r+dr, c=X.act.c+dc; const s=curSheet();
  while(s.hiddenRows&&s.hiddenRows[r]&&r>1) r+=dr||1;
  r=Math.max(1,r); c=Math.max(1,c);
  if(extend){ X.sel.r2=Math.max(1,X.sel.r2+dr); X.sel.c2=Math.max(1,X.sel.c2+dc); paintSel(); updateFbar(); renderStatus(); ensureVisible(X.sel.r2,X.sel.c2); return; }
  X.areas=[]; setSel(r,c,r,c); ensureVisible(r,c);
}
function jumpEdge(dr,dc,extend){
  const s=X.sheet; const from=extend?{r:X.sel.r2,c:X.sel.c2}:X.act; let r=from.r, c=from.c;
  const filled=(rr,cc)=>{ const v=X.wb.getValue(s,rr,cc); const lc=X.wb.layers.get(s); return (v!=null&&v!=="")||(lc&&lc.cells.has(rr+","+cc)); };
  const b=X.wb.usedBounds(s); const maxR=Math.max(b.r2,1), maxC=Math.max(b.c2,1);
  const cur=filled(r,c), nxt=filled(r+dr,c+dc);
  if(cur&&nxt){ while(r+dr>=1&&c+dc>=1&&r+dr<=maxR+1&&c+dc<=maxC+1&&filled(r+dr,c+dc)){ r+=dr; c+=dc; } }
  else { r+=dr; c+=dc; while(r>=1&&c>=1&&r<=maxR&&c<=maxC&&!filled(r,c)){ r+=dr; c+=dc; } if(r>maxR||c>maxC||r<1||c<1){ r=Math.min(Math.max(r,1),dr?Math.max(maxR,X.act.r):r); c=Math.min(Math.max(c,1),dc?Math.max(maxC,X.act.c):c); } }
  r=Math.max(1,r); c=Math.max(1,c);
  if(extend){ X.sel.r2=r; X.sel.c2=c; paintSel(); updateFbar(); renderStatus(); } else setSel(r,c,r,c);
  ensureVisible(r,c);
}
function currentRegion(r,c){
  const s=X.sheet; const f=(rr,cc)=>{ if(rr<1||cc<1) return false; const v=X.wb.getValue(s,rr,cc); return v!=null&&v!==""; };
  let g={r1:r,c1:c,r2:r,c2:c}; let grow=true, n=0;
  while(grow&&n++<200){ grow=false;
    for(let cc=g.c1-1;cc<=g.c2+1;cc++){ if(f(g.r1-1,cc)){ g.r1--; grow=true; break; } }
    for(let cc=g.c1-1;cc<=g.c2+1;cc++){ if(f(g.r2+1,cc)){ g.r2++; grow=true; break; } }
    for(let rr=g.r1-1;rr<=g.r2+1;rr++){ if(f(rr,g.c1-1)){ g.c1--; grow=true; break; } }
    for(let rr=g.r1-1;rr<=g.r2+1;rr++){ if(f(rr,g.c2+1)){ g.c2++; grow=true; break; } }
  }
  return g;
}

/* ---------- presse-papiers ---------- */
function doCopy(cut){
  const g=selG(); const s=curSheet(); const cells=[];
  for(let r=g.r1;r<=g.r2;r++){ const row=[]; for(let c=g.c1;c<=g.c2;c++){ const cl=s.cells[A1(r,c)]; const lc=X.wb.layers.get(s.name); const L=lc&&lc.cells.get(r+","+c); row.push(L?{v:L.v,nf:L.nf}:(cl?clone(cl):null)); } cells.push(row); }
  X.clip={sheet:X.sheet,g,cut:!!cut,cells};
  try{ const tsv=cells.map((row,i)=>row.map((x,j)=>formatValue(X.wb.getValue(X.sheet,g.r1+i,g.c1+j),x&&x.nf).text).join("\t")).join("\n"); navigator.clipboard&&navigator.clipboard.writeText(tsv).catch(()=>{}); }catch(e){}
  paintSel(); X.status=cut?"Sélectionnez la destination et appuyez sur Entrée ou choisissez Coller":"Sélectionnez la destination et appuyez sur Entrée ou choisissez Coller"; renderStatus();
}
function doPaste(mode){
  if(!X.clip) return;
  const C=X.clip; const g0=selG(); const R=C.cells.length, Cn=C.cells[0].length;
  let tr=Math.max(1,Math.floor((g0.r2-g0.r1+1)/R)), tc=Math.max(1,Math.floor((g0.c2-g0.c1+1)/Cn));
  if(mode==="transpose"){ tr=1; tc=1; }
  const dest={r1:g0.r1,c1:g0.c1,r2:g0.r1+(mode==="transpose"?Cn:R*tr)-1,c2:g0.c1+(mode==="transpose"?R:Cn*tc)-1};
  if(!guardEdit(dest)||!guardPivot(dest)) return;
  mutate(()=>{
    const s=curSheet(); const src=X.wb.sheet(C.sheet);
    if(C.cut){ for(let r=C.g.r1;r<=C.g.r2;r++) for(let c=C.g.c1;c<=C.g.c2;c++) delete src.cells[A1(r,c)]; }
    for(let a=0;a<tr;a++) for(let b=0;b<tc;b++) for(let i=0;i<R;i++) for(let j=0;j<Cn;j++){
      const o=C.cells[i][j]; const r=mode==="transpose"?dest.r1+j:dest.r1+a*R+i, c=mode==="transpose"?dest.c1+i:dest.c1+b*Cn+j;
      const k=A1(r,c);
      if(!o){ if(mode!=="formats") delete s.cells[k]; continue; }
      const n=clone(o);
      if(n.f&&!C.cut) n.f=shiftFormula(n.f,r-(C.g.r1+i),c-(C.g.c1+j));
      if(mode==="values"){ const v=X.wb.getValue(C.sheet,C.g.r1+i,C.g.c1+j); const old=s.cells[k]||{}; delete old.f; old.v=isErr(v)?v.code:v; s.cells[k]=old; continue; }
      if(mode==="formats"){ const old=s.cells[k]||{}; ["nf","b","i","u","fc","bg","al","fs","fn","wrap","bd"].forEach(p=>{ if(n[p]!=null) old[p]=n[p]; else delete old[p]; }); s.cells[k]=old; continue; }
      if(mode==="formulas"){ const old=s.cells[k]||{}; delete old.v; delete old.f; if(n.f) old.f=n.f; else old.v=n.v; s.cells[k]=old; continue; }
      s.cells[k]=n;
    }
    X.sel=Object.assign({},dest); X.act={r:dest.r1,c:dest.c1};
    if(C.cut) X.clip=null;
  });
  X.status="Prêt";
}
function clearSel(what){
  const g=selG(); if(!guardEdit(g)||!guardPivot(g)) return;
  mutate(()=>{ allAreas().forEach(a=>X.wb.clearRange(X.sheet,a,what||"contents")); if(what==="all"||what==="formats"){ /* aussi MFC ? non */ } });
}

/* ---------- recopie (poignée) ---------- */
function seriesFill(src,dir,count){
  // src : rectangle source ; dir : "down"/"right"/"up"/"left" ; count : nombre de cellules à ajouter
  const s=curSheet();
  const vertical=dir==="down"||dir==="up";
  const lines=vertical?(src.c2-src.c1+1):(src.r2-src.r1+1);
  for(let li=0;li<lines;li++){
    const seq=[]; const n=vertical?(src.r2-src.r1+1):(src.c2-src.c1+1);
    for(let k=0;k<n;k++){ const r=vertical?src.r1+k:src.r1+li, c=vertical?src.c1+li:src.c1+k; seq.push({r,c,cl:s.cells[A1(r,c)]?clone(s.cells[A1(r,c)]):null}); }
    const nums=seq.map(x=>x.cl&&!x.cl.f&&typeof x.cl.v==="number"?x.cl.v:null);
    const allNum=nums.every(x=>x!=null);
    let step=null; if(allNum&&n>=2) step=(nums[n-1]-nums[0])/(n-1);
    else if(allNum&&n===1&&seq[0].cl&&seq[0].cl.nf&&isDateCode(seq[0].cl.nf)) step=1;
    const txtNum=n===1&&seq[0].cl&&typeof seq[0].cl.v==="string"?/^(.*?)(\d+)$/.exec(seq[0].cl.v):null;
    for(let k=1;k<=count;k++){
      const srcIdx=(dir==="down"||dir==="right")?(k-1)%n:(n-1-((k-1)%n));
      const base=seq[srcIdx];
      const r=dir==="down"?src.r2+k:dir==="up"?src.r1-k:(vertical?0:base.r);
      const c=dir==="right"?src.c2+k:dir==="left"?src.c1-k:(vertical?base.c:0);
      const rr=vertical?r:base.r, cc=vertical?base.c:c; if(rr<1||cc<1) continue;
      const dR=rr-base.r, dC=cc-base.c;
      let o=base.cl?clone(base.cl):null;
      if(o){
        if(o.f) o.f=shiftFormula(o.f,dR,dC);
        else if(step!=null){ const off=(dir==="down"||dir==="right")?(n-1+k):(-k); o.v=nums[0]+step*off; }
        else if(txtNum){ const kk=(dir==="down"||dir==="right")?k:-k; o.v=txtNum[1]+String(Math.max(0,+txtNum[2]+kk)).padStart(txtNum[2].length,"0"); }
        else if(typeof o.v==="string"){ const mi=MONTHS_FR.indexOf(o.v.toLowerCase()); const di=DAYS_FR.indexOf(o.v.toLowerCase()); if(mi>=0) o.v=MONTHS_FR[(mi+k)%12]; else if(di>=0) o.v=DAYS_FR[(di+k)%7]; }
        s.cells[A1(rr,cc)]=o;
      } else delete s.cells[A1(rr,cc)];
    }
  }
}
function fillDownDouble(){
  const g=selG(); const s=X.sheet; let last=g.r2;
  const probe=g.c1>1?g.c1-1:g.c2+1;
  let r=g.r2+1; while(r<10000){ const v=X.wb.getValue(s,r,probe); const v2=g.c2+1<=16384?X.wb.getValue(s,r,g.c2+1):null; if((v==null||v==="")&&(v2==null||v2==="")) break; last=r; r++; }
  if(last<=g.r2) return;
  if(!guardEdit({r1:g.r1,c1:g.c1,r2:last,c2:g.c2})) return;
  mutate(()=>{ seriesFill(g,"down",last-g.r2); X.sel={r1:g.r1,c1:g.c1,r2:last,c2:g.c2}; });
}

function gotoName(t){
  if(!t) return;
  const nm=Object.keys(X.wb.names).find(n=>n.toLowerCase()===t.toLowerCase());
  const tb=X.wb.tableCI(t);
  let ref=null;
  if(nm) ref=parseFullRef(X.wb.names[nm],X.sheet); else if(tb){ const g=parseRangeStr(tb.ref); ref=Object.assign({sheet:tb.sheet},g,{r1:g.r1+1}); } else ref=parseFullRef(t,X.sheet);
  if(ref&&X.wb.sheet(ref.sheet)){ if(ref.sheet!==X.sheet) switchSheet(ref.sheet); X.areas=[]; setSel(ref.r1,ref.c1,ref.r2,ref.c2); ensureVisible(ref.r1,ref.c1); return; }
  if(/^[A-Za-zÀ-ÿ_\\][\wÀ-ÿ.]*$/.test(t)&&!parseA1(t)){ mutate(()=>{ X.wb.names[t]="="+fullRefStr(X.sheet,selG(),true); }); updateFbar(); toast("Nom « "+t+" » défini."); return; }
  xlAlert("Référence non valide.","warn");
}

/* ---------- souris ---------- */
function gridMouseDown(e){
  if(e.button===2){ const p=localPt(e); const cl=cellAtPoint(p.x,p.y); const g=selG(); if(!(cl.r>=g.r1&&cl.r<=g.r2&&cl.c>=g.c1&&cl.c<=g.c2)&&!e.target.closest(".chart")){ if(!X.edit) setSel(cl.r,cl.c,cl.r,cl.c); } return; }
  if(e.button!==0) return;
  closeMenus();
  const t=e.target;
  if(t.closest(".chart")) return; // géré par le graphique
  if(t.closest(".filter-btn")){ e.preventDefault(); const fb=t.closest(".filter-btn"); if(fb.dataset.filter) openTableFilter(fb.dataset.filter,fb); else openPivotFilter(fb.dataset.pvfilter,fb); return; }
  if(t.closest(".dv-btn")) return;
  if(t.id==="cellEditor") return;
  const p=localPt(e);
  // RefEdit d'une boîte de dialogue
  const ae=document.activeElement;
  if(dlgOpen()){
    if(ae&&ae.dataset&&ae.dataset.refedit!=null){ e.preventDefault(); const cl=cellAtPoint(p.x,p.y); X.drag={kind:"refedit",start:cl,input:ae}; setRefEdit(ae,{r1:cl.r,c1:cl.c,r2:cl.r,c2:cl.c}); return; }
    flashDlg(); e.preventDefault(); return;
  }
  if(t.id==="ovFill"){ e.preventDefault(); X.drag={kind:"fill",src:selG(),dir:null,count:0}; return; }
  const th=t.closest("th");
  if(th){
    e.preventDefault(); if(X.edit) commitEdit();
    if(th.dataset.h==="all"){ X.areas=[]; setSel(1,1,1048576,16384,{r:1,c:1}); return; }
    if(th.dataset.hc){ const c=+th.dataset.hc; if(e.shiftKey){ X.sel.c2=c; X.sel.r1=1; X.sel.r2=1048576; paintSel(); updateFbar(); renderStatus(); } else { if(!e.ctrlKey) X.areas=[]; else X.areas.push(selG()); setSel(1,c,1048576,c,{r:Math.max(1,X.L.maxR>0?1:1),c}); X.drag={kind:"cols",start:c}; } return; }
    if(th.dataset.hr){ const r=+th.dataset.hr; if(e.shiftKey){ X.sel.r2=r; X.sel.c1=1; X.sel.c2=16384; paintSel(); updateFbar(); renderStatus(); } else { if(!e.ctrlKey) X.areas=[]; else X.areas.push(selG()); setSel(r,1,r,16384,{r,c:1}); X.drag={kind:"rows",start:r}; } return; }
  }
  const cl=cellAtPoint(p.x,p.y);
  if(X.edit){
    if(canPoint()){ e.preventDefault(); if(e.ctrlKey&&X.edit.point){ const el=editorEl(); const p2=X.edit.point.start+X.edit.point.len; X.edit.text=X.edit.text.slice(0,p2)+";"+X.edit.text.slice(p2); el.value=X.edit.text; el.setSelectionRange(p2+1,p2+1); X.edit.point=null; }
      insertPointRef({r1:cl.r,c1:cl.c,r2:cl.r,c2:cl.c},X.sheet); X.drag={kind:"point",start:cl}; return; }
    commitEdit();
  }

  if(sc2) sc2.ticks.forEach(t=>{ const p=vpos(t,sc2); s+=svgText(W-Rr+6,p+3,fmtAxis(t),{anchor:"start",fill:fg}); });
  const band=(horiz?ph:pw)/Math.max(1,nC);
  cats.forEach((c,k)=>{ const m=(horiz?T:L)+band*k+band/2; if(horiz) s+=svgText(L-5,m+3,String(c),{anchor:"end",fill:fg,fs:9}); else if(rot) s+=svgText(m+3,B+10,String(c),{anchor:"end",fill:fg,fs:9,rot:-45}); else if(nC<=40) s+=svgText(m,B+13,String(c),{fill:fg,fs:9}); });
  s+=horiz?`<line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="${gridC}"/>`:`<line x1="${L}" y1="${B}" x2="${L+pw}" y2="${B}" stroke="${gridC}"/>`;
  // barres / colonnes
  const barIdx=series.map((_,i)=>i).filter(i=>/^(col|bar)/.test(types[i]));
  const lineIdx=series.map((_,i)=>i).filter(i=>/^(line|area)/.test(types[i]));
  const nb=stacked?1:Math.max(1,barIdx.length); const gap=band*0.25; const bw=(band-gap*2)/nb;
  const posStack=new Array(nC).fill(0), negStack=new Array(nC).fill(0);
  barIdx.forEach((i,bi)=>{ const sc=sec[i]?sc2:sc1; const col=SERIES_COLORS[i%10];
    for(let k=0;k<nC;k++){ const v=vals[i][k]||0; let a,b;
      if(stacked){ if(v>=0){ a=posStack[k]; b=a+v; posStack[k]=b; } else { a=negStack[k]; b=a+v; negStack[k]=b; } } else { a=0; b=v; }
      const p1=vpos(Math.max(sc.lo,Math.min(a,b)),sc), p2=vpos(Math.max(a,b),sc);
      const off=(horiz?T:L)+band*k+gap+(stacked?0:bi*bw);
      if(horiz){ const x=Math.min(p1,p2), w=Math.abs(p2-p1); s+=`<rect x="${x.toFixed(1)}" y="${off.toFixed(1)}" width="${w.toFixed(1)}" height="${bw.toFixed(1)}" fill="${col}"/>`;
        if(threeD) s+=`<path d="M${x},${off} l6,-6 h${w.toFixed(1)} l-6,6 Z" fill="${mixHex(col,"#FFFFFF",0.35)}"/><path d="M${(x+w).toFixed(1)},${off} l6,-6 v${bw.toFixed(1)} l-6,6 Z" fill="${mixHex(col,"#000000",0.25)}"/>`;
        if(el.labels) s+=svgText(x+w+3,off+bw/2+3,fmtAxis(series[i].values[k],false),{anchor:"start",fill:fg,fs:9}); }
      else { const y=Math.min(p1,p2), h=Math.abs(p2-p1); s+=`<rect x="${off.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;
        if(threeD) s+=`<path d="M${off},${y} l6,-6 h${bw.toFixed(1)} l-6,6 Z" fill="${mixHex(col,"#FFFFFF",0.35)}"/><path d="M${(off+bw).toFixed(1)},${y} l6,-6 v${h.toFixed(1)} l-6,6 Z" fill="${mixHex(col,"#000000",0.25)}"/>`;
        if(el.labels) s+=svgText(off+bw/2,y-3,fmtAxis(series[i].values[k],false),{fill:fg,fs:9}); } } });
  lineIdx.forEach(i=>{ const sc=sec[i]?sc2:sc1; const col=SERIES_COLORS[i%10]; const pts=[];
    for(let k=0;k<nC;k++){ const m=(horiz?T:L)+band*k+band/2; const p=vpos(vals[i][k]||0,sc); pts.push(horiz?[p,m]:[m,p]); }
    if(/^area/.test(types[i])) s+=`<path d="M${pts[0][0]},${B} L${pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" L")} L${pts[pts.length-1][0]},${B} Z" fill="${col}" opacity=".85"/>`;
    else s+=`<polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="2.25"/>`;
    if(types[i]==="lineMarkers") pts.forEach(p=>s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${col}" stroke="#fff" stroke-width=".8"/>`);
    if(el.labels) pts.forEach((p,k)=>s+=svgText(p[0],p[1]-6,fmtAxis(series[i].values[k]),{fill:fg,fs:9})); });
  return s+"</svg>";
}
function seriesType(ch,name,i){
  if(ch.type==="combo"){ const c=(ch.combo||[]).find(x=>x.name===name); return c?c.type:"col"; }
  if(/^col|^bar/.test(ch.type)) return /^bar/.test(ch.type)?"bar":"col";
  if(/^line/.test(ch.type)) return ch.type==="lineMarkers"?"lineMarkers":"line";
  if(/^area/.test(ch.type)) return "area";
  return "col";
}

function findPivot(name){ for(const s of X.wb.sheets) for(const pv of s.pivots||[]) if(pv.name===name) return {pv,s}; return null; }

function removeField(pv,n){ pv.rows=pv.rows.filter(x=>x!==n); pv.cols=(pv.cols||[]).filter(x=>x!==n); pv.filters=(pv.filters||[]).filter(x=>x.field!==n); pv.values=pv.values.filter(v=>v.field!==n); }

function applyTableFilters(s){

  for(const key in (s.tblFilters||{})){ const [tname,colS]=key.split("|"); const t=X.wb.tableCI(tname); if(!t) continue; const g=parseRangeStr(t.ref); const col=+colS; const sel=s.tblFilters[key];

function sortRange(g,col,dir){
  if(!guardEdit(g)) return;
  mutate(()=>{
    const s=curSheet(); const rows=[];
    for(let r=g.r1;r<=g.r2;r++){ const row={}; for(let c=g.c1;c<=g.c2;c++){ const cl=s.cells[A1(r,c)]; row[c]=cl?clone(cl):null; } rows.push({r,row,key:X.wb.getValue(s.name,r,col)}); }
    rows.sort((a,b)=>{ const x=a.key, y=b.key; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return dir*cmpVals(x,y); });
    rows.forEach((o,i)=>{ const r=g.r1+i; for(let c=g.c1;c<=g.c2;c++){ const cl=o.row[c]; if(cl){ if(cl.f) cl.f=shiftFormula(cl.f,r-o.r,0); s.cells[A1(r,c)]=cl; } else delete s.cells[A1(r,c)]; } });

const CUSTOM_CODES=["Standard","0","0,00","# ##0","# ##0,00","# ##0 €","# ##0,00 €","0%","0,00%","0,00E+00","jj/mm/aaaa","jj-mmm-aa","jj-mmm","mmm-aa","mmmm","mmm","jjjj","aaaa","hh:mm","hh:mm:ss","jj/mm/aaaa hh:mm","@","# ##0;[Rouge]-# ##0"];
function nfFromParts(cat,o){
  const dec=Math.max(0,Math.min(30,o.dec|0)); const d=dec?","+"0".repeat(dec):"";
  switch(cat){
    case "Standard": return "Standard";
    case "Nombre": { const base=(o.sep?"# ##0":"0")+d; return o.neg==="red"?base+";[Rouge]"+base:o.neg==="redm"?base+";[Rouge]-"+base:base; }
    case "Monétaire": case "Comptabilité": { const sym=o.sym==="$"?"$":o.sym==="none"?"":"€"; return "# ##0"+d+(sym?" "+sym:""); }
    case "Pourcentage": return "0"+d+"%";
    case "Scientifique": return "0"+d+"E+00";
    case "Texte": return "@";
    case "Fraction": return "# ?/?";
    case "Date": case "Heure": return o.type||"jj/mm/aaaa";
    case "Spécial": return "00000";
    case "Personnalisée": return o.custom||"Standard";
  }
  return "Standard";
}
function nfToParts(nf){
  if(!nf||nf==="Standard") return {cat:"Standard",dec:2};
  if(nf==="@") return {cat:"Texte"};
  if(/E\+/.test(nf)) return {cat:"Scientifique",dec:((nf.split(",")[1]||"").match(/0/g)||[]).length};
  if(/%/.test(nf)) return {cat:"Pourcentage",dec:((nf.split(",")[1]||"").match(/0/g)||[]).length};
  if(/€|\$/.test(nf)&&/^# ##0(,0+)? (€|\$)$/.test(nf)) return {cat:"Monétaire",dec:((nf.split(",")[1]||"").match(/0/g)||[]).length,sym:/\$/.test(nf)?"$":"€"};
  if(DATE_TYPES.some(t=>t[0]===nf)) return {cat:"Date",type:nf};
  if(TIME_TYPES.some(t=>t[0]===nf)) return {cat:"Heure",type:nf};
  if(/^(# ##0|0)(,0+)?$/.test(nf)) return {cat:"Nombre",dec:((nf.split(",")[1]||"").match(/0/g)||[]).length,sep:/#/.test(nf)};
  return {cat:"Personnalisée",custom:nf};
}

        } });

    });

function rangesOverlap(a,b){ return !(a.r2<b.r1||a.r1>b.r2||a.c2<b.c1||a.c1>b.c2); }
function ruleRanges(rule){ return String(rule.range).split(/[;,\s]+/).filter(Boolean).map(parseRangeStr).filter(Boolean); }
function clearCf(scope){ if(!guardFormat()) return; const s=curSheet(); mutate(()=>{ if(scope==="sheet") s.cf=[]; else { const g=selG(); s.cf=s.cf.filter(r=>!ruleRanges(r).some(x=>rangesOverlap(x,g))); } }); }

function ruleLabel(r){

function rulePreview(r){

function openCfManager(){
  const s=curSheet(); let rules=clone(s.cf||[]); let scope="sel", selId=null;
  const api=openDlg({title:"Gestionnaire des règles de mise en forme conditionnelle",w:720,baseSheet:X.sheet,body:`<div class="w-row"><label>Afficher les règles de mise en forme pour :</label><select class="w-sel" id="cmScope"><option value="sel">Sélection actuelle</option><option value="sheet">Cette feuille de calcul</option></select></div>
    <div class="w-row"><button class="wbtn" id="cmNew">Nouvelle règle…</button><button class="wbtn" id="cmEdit">Modifier la règle…</button><button class="wbtn" id="cmDel">Supprimer la règle</button><button class="wbtn" id="cmUp" style="min-width:30px">▲</button><button class="wbtn" id="cmDown" style="min-width:30px">▼</button></div>
    <div class="w-list" style="height:200px"><table style="width:100%;border-collapse:collapse" id="cmTable"></table></div>`,
    buttons:[{t:"OK",def:true,fn:()=>commit()},{t:"Annuler",cancel:true},{t:"Appliquer",fn:()=>{ commit(); return false; }}]});
  function visible(){ if(scope==="sheet") return rules; const g=selG(); return rules.filter(r=>ruleRanges(r).some(x=>rangesOverlap(x,g))); }

    const v=visible(); if(selId==null&&v[0]) selId=v[0].id;
    api.q("#cmTable").innerHTML=`<tr class="small" style="background:#F0F0F0"><td style="padding:3px 6px">Règle (appliquée dans l'ordre indiqué)</td><td>Format</td><td>S'applique à</td><td>Interrompre si vrai</td></tr>`+v.map(r=>`<tr class="it${r.id===selId?" on":""}" data-id="${r.id}" style="display:table-row"><td style="padding:4px 6px;max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(ruleLabel(r))}</td><td>${rulePreview(r)}</td><td><input class="w-in" data-rng="${r.id}" data-refedit="eq" value="${escA("="+String(r.range).split(/[;,\s]+/).map(x=>{ const g=parseRangeStr(x); return g?rangeToStr(g,true):x; }).join(";"))}" style="width:150px"></td><td style="text-align:center"><input type="checkbox"${r.stop?" checked":""} data-stop="${r.id}"></td></tr>`).join("");
    api.qa("#cmTable tr[data-id]").forEach(tr=>tr.onclick=e=>{ if(e.target.matches("input")) { selId=+tr.dataset.id; api.qa("#cmTable tr[data-id]").forEach(x=>x.classList.toggle("on",x===tr)); return; } selId=+tr.dataset.id; draw(); });
    api.qa("[data-rng]").forEach(i=>i.addEventListener("input",()=>{ const r=rules.find(x=>x.id===+i.dataset.rng); const v2=i.value.replace(/^=/,"").replace(/\$/g,"").split(/[;,]/).map(x=>x.includes("!")?x.split("!")[1]:x).join(" "); if(v2.split(" ").every(x=>parseRangeStr(x))) r.range=v2; }));
    api.qa("[data-stop]").forEach(i=>i.onchange=()=>{ rules.find(x=>x.id===+i.dataset.stop).stop=i.checked; });
  }
  api.q("#cmScope").onchange=e=>{ scope=e.target.value; selId=null; draw(); };
  api.q("#cmNew").onclick=()=>openCfRuleDialog(null,null,out=>{ out.id=++cfSeq; out.range=selRefStr(); rules.unshift(out); selId=out.id; draw(); });
  api.q("#cmEdit").onclick=()=>{ const r=rules.find(x=>x.id===selId); if(!r) return; openCfRuleDialog(r,null,out=>{ Object.keys(r).forEach(k=>{ if(!["id","range","stop"].includes(k)) delete r[k]; }); Object.assign(r,out); draw(); }); };
  api.q("#cmDel").onclick=()=>{ rules=rules.filter(x=>x.id!==selId); selId=null; draw(); };
  api.q("#cmUp").onclick=()=>{ const i=rules.findIndex(x=>x.id===selId); if(i>0){ const t=rules[i]; rules[i]=rules[i-1]; rules[i-1]=t; draw(); } };
  api.q("#cmDown").onclick=()=>{ const i=rules.findIndex(x=>x.id===selId); if(i>=0&&i<rules.length-1){ const t=rules[i]; rules[i]=rules[i+1]; rules[i+1]=t; draw(); } };
  function commit(){ if(!guardFormat()) return false; mutate(()=>{ s.cf=clone(rules); X.wb.log.push({a:"cfManager"}); }); }
  draw(); api.center();
}

      b.querySelectorAll("input[name=ms]").forEach(r=>r.onchange=()=>{ M.v=r.value; });

function openSeriesDialog(){
  const g=selG(); if(!guardEdit(g)) return;
  const rows=(g.c2-g.c1)>=(g.r2-g.r1);
  openDlg({title:"Série de données",w:440,body:`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div class="w-group"><span class="gl">Série en</span><label class="w-rad"><input type="radio" name="sIn" value="r"${rows?" checked":""}> Lignes</label><label class="w-rad"><input type="radio" name="sIn" value="c"${!rows?" checked":""}> Colonnes</label></div><div class="w-group"><span class="gl">Type</span><label class="w-rad"><input type="radio" name="sTy" value="lin" checked> Linéaire</label><label class="w-rad"><input type="radio" name="sTy" value="geo"> Géométrique</label><label class="w-rad"><input type="radio" name="sTy" value="date"> Chronologique</label><label class="w-rad"><input type="radio" name="sTy" value="auto"> Recopie incrémentée</label></div><div class="w-group"><span class="gl">Unité de temps</span><label class="w-rad"><input type="radio" name="sU" value="d" checked disabled> Jour</label><label class="w-rad"><input type="radio" name="sU" value="w" disabled> Jour ouvré</label><label class="w-rad"><input type="radio" name="sU" value="m" disabled> Mois</label><label class="w-rad"><input type="radio" name="sU" value="y" disabled> Année</label></div></div><label class="w-chk"><input type="checkbox" id="sTrend"> Tendance</label><div class="w-row"><label>Valeur du pas :</label><input class="w-in" id="sStep" value="1" style="width:90px"><label style="min-width:auto;margin-left:10px">Dernière valeur :</label><input class="w-in" id="sStop" style="width:90px"></div>`,
    onMount(api){ api.qa("input[name=sTy]").forEach(r=>r.onchange=()=>{ const d=api.q("input[name=sTy]:checked").value==="date"; api.qa("input[name=sU]").forEach(u=>u.disabled=!d); }); },
    buttons:[{t:"OK",def:true,fn:api=>{
      const inRows=api.q("input[name=sIn]:checked").value==="r"; const ty=api.q("input[name=sTy]:checked").value; const unit=api.q("input[name=sU]:checked").value;
      const step=Number(String(api.q("#sStep").value).replace(",",".")); const stopS=api.q("#sStop").value.trim(); const stop=stopS?Number(stopS.replace(",",".")):null;
      if(isNaN(step)){ xlAlert("Valeur du pas incorrecte.","warn"); return false; }
      mutate(()=>{ const s=curSheet();
        const lines=inRows?[...Array(g.r2-g.r1+1).keys()].map(i=>g.r1+i):[...Array(g.c2-g.c1+1).keys()].map(i=>g.c1+i);
        lines.forEach(L=>{ const first=inRows?{r:L,c:g.c1}:{r:g.r1,c:L}; const cl=s.cells[A1(first.r,first.c)]; if(!cl||typeof cl.v!=="number") return; let v=cl.v;
          const n=inRows?g.c2-g.c1:g.r2-g.r1;
          for(let k=1;k<=n;k++){
            if(ty==="lin"||ty==="auto") v=v+step; else if(ty==="geo") v=v*step;
            else if(ty==="date"){ const d=serialToDate(cl.v); if(unit==="d") v=v+step; else if(unit==="w"){ let x=v; let kk=step; while(kk>0){ x++; const w=serialToDate(x).getUTCDay(); if(w!==0&&w!==6) kk--; } v=x; } else if(unit==="m") v=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+step*k,d.getUTCDate())-EXCEL_EPOCH)/86400000); else v=Math.round((Date.UTC(d.getUTCFullYear()+step*k,d.getUTCMonth(),d.getUTCDate())-EXCEL_EPOCH)/86400000); }
            if(stop!=null&&((step>=0&&v>stop)||(step<0&&v<stop))) break;
            const r=inRows?L:g.r1+k, c=inRows?g.c1+k:L; const o=s.cells[A1(r,c)]||(s.cells[A1(r,c)]={}); delete o.f; o.v=v; if(cl.nf&&!o.nf) o.nf=cl.nf; }
        });
        X.wb.log.push({a:"series",type:ty,step});
      }); }},{t:"Annuler",cancel:true}]});
}

function openForecast(){

  const hasHead=typeof X.wb.getValue(s.name,g.r1,g.c1)==="string"; const r0=g.r1+(hasHead?1:0);
  const dates=[], vals=[]; for(let r=r0;r<=g.r2;r++){ const d=X.wb.getValue(s.name,r,g.c1), v=X.wb.getValue(s.name,r,g.c1+1); if(typeof d==="number"&&typeof v==="number"){ dates.push(d); vals.push(v); } }
  if(dates.length<3||g.c2-g.c1<1){ xlAlert("Pour créer une prévision, sélectionnez une série de données comportant des dates ou des heures et les valeurs correspondantes.","warn"); return; }
  const monthly=dates.length>1&&Math.abs((dates[1]-dates[0])-30.4)<4;
  const last=dates[dates.length-1]; const defEnd=monthly?Math.round((Date.UTC(serialToDate(last).getUTCFullYear(),serialToDate(last).getUTCMonth()+Math.round(dates.length/3),1)-EXCEL_EPOCH)/86400000):last+(dates[1]-dates[0])*Math.round(dates.length/3);
  const vh=hasHead?txt2(X.wb.getValue(s.name,g.r1,g.c1+1)):"Valeurs", dh=hasHead?txt2(X.wb.getValue(s.name,g.r1,g.c1)):"Chronologie";
  let kind="line";
  const api=openDlg({title:"Créer une feuille de calcul de prévision",w:640,baseSheet:X.sheet,body:`<div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:4px"><button class="wbtn" id="fkL" style="min-width:34px" title="Créer un graphique en courbes">${ico("chartLine").replace("<svg","<svg width=18 height=18")}</button><button class="wbtn" id="fkC" style="min-width:34px" title="Créer un histogramme">${ico("chartCol").replace("<svg","<svg width=18 height=18")}</button></div><div id="fkPrev" style="border:1px solid #ADADAD;background:#fff;height:230px"></div><div class="w-row" style="margin-top:8px"><label>Fin de la prévision</label><input class="w-in" id="fkEnd" value="${formatValue(defEnd,NF.DATE).text}" style="width:110px"></div>
    <details><summary>Options</summary><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px"><div class="w-row"><label>Début de la prévision</label><input class="w-in" value="${formatValue(last,NF.DATE).text}" style="width:100px" disabled></div><div class="w-row"><label>Plage chronologie</label><input class="w-in" value="${escA(fullRefStr(s.name,{r1:r0,c1:g.c1,r2:g.r2,c2:g.c1},true))}"></div><div class="w-row"><label>Intervalle de confiance</label><input class="w-in" value="95%" style="width:60px"></div><div class="w-row"><label>Plage de valeurs</label><input class="w-in" value="${escA(fullRefStr(s.name,{r1:r0,c1:g.c1+1,r2:g.r2,c2:g.c1+1},true))}"></div><div><b>Saisonnalité</b><label class="w-rad"><input type="radio" checked name="fs"> Détecter automatiquement</label><label class="w-rad"><input type="radio" name="fs"> Définir manuellement</label></div><div><div class="w-row"><label>Remplir les points manquants à l'aide de</label><select class="w-sel"><option>Interpolation</option></select></div><div class="w-row"><label>Agréger les doublons à l'aide de</label><select class="w-sel"><option>Moyenne</option></select></div><label class="w-chk"><input type="checkbox"> Inclure les statistiques de prévision</label></div></div></details>`,
    buttons:[{t:"Créer",def:true,fn:()=>create()},{t:"Annuler",cancel:true}]});
  function series(endSerial){ // tendance linéaire + saisonnalité moyenne
    const n=vals.length; const xs=vals.map((_,i)=>i); const mx=(n-1)/2, my=vals.reduce((a,b)=>a+b,0)/n; let sxy=0,sxx=0; xs.forEach((x,i)=>{ sxy+=(x-mx)*(vals[i]-my); sxx+=(x-mx)**2; }); const b=sxy/sxx, a=my-b*mx;
    const per=monthly&&n>=24?12:0; const seas=new Array(per||1).fill(0), cnt=new Array(per||1).fill(0); if(per) vals.forEach((v,i)=>{ seas[i%per]+=v-(a+b*i); cnt[i%per]++; }); for(let k=0;k<seas.length;k++) seas[k]=cnt[k]?seas[k]/cnt[k]:0;
    const resid=vals.map((v,i)=>v-(a+b*i+(per?seas[i%per]:0))); const sd=Math.sqrt(resid.reduce((s2,r)=>s2+r*r,0)/Math.max(1,n-2));
    const out=[]; let i=n; let d=last;
    while(true){ d=monthly?Math.round((Date.UTC(serialToDate(last).getUTCFullYear(),serialToDate(last).getUTCMonth()+(i-n+1),1)-EXCEL_EPOCH)/86400000):d+(dates[1]-dates[0]); if(d>endSerial||out.length>240) break; const f=a+b*i+(per?seas[i%per]:0); const w=1.96*sd*Math.sqrt(1+(i-n+1)/n); out.push({d,f,lo:f-w,hi:f+w}); i++; }
    return out; }
  function endVal(){ const t=api.q("#fkEnd").value.trim(); const p=parseInput(t); return p&&typeof p.v==="number"?p.v:null; }
  function prev(){ const e=endVal(); const fc=e?series(e):[]; const W=600,H=230; const all=vals.concat(fc.map(x=>x.hi)).concat(fc.map(x=>x.lo)); const mn=Math.min(...all), mxv=Math.max(...all); const sc=niceScale(mn,mxv,5); const N=vals.length+fc.length;
    const xp=i=>46+i*(W-60)/Math.max(1,N-1), yp=v=>H-30-(v-sc.lo)/(sc.hi-sc.lo)*(H-50);
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">`; sc.ticks.forEach(t=>{ svg+=`<line x1="40" y1="${yp(t)}" x2="${W-10}" y2="${yp(t)}" stroke="#E0E0E0"/>`+svgText(36,yp(t)+3,fmtAxis(t),{anchor:"end"}); });
    if(kind==="line"){ svg+=`<polyline fill="none" stroke="#4472C4" stroke-width="2" points="${vals.map((v,i)=>xp(i)+","+yp(v)).join(" ")}"/>`; if(fc.length){ svg+=`<polyline fill="none" stroke="#ED7D31" stroke-width="2" points="${[vals.length-1].concat(fc.map((_,k)=>vals.length+k)).map((i,k)=>xp(i)+","+yp(k===0?vals[vals.length-1]:fc[k-1].f)).join(" ")}"/><polyline fill="none" stroke="#7F7F7F" stroke-dasharray="3 2" points="${fc.map((x,k)=>xp(vals.length+k)+","+yp(x.lo)).join(" ")}"/><polyline fill="none" stroke="#7F7F7F" stroke-dasharray="3 2" points="${fc.map((x,k)=>xp(vals.length+k)+","+yp(x.hi)).join(" ")}"/>`; } }
    else { const bw=(W-60)/N*0.7; vals.forEach((v,i)=>svg+=`<rect x="${xp(i)-bw/2}" y="${yp(v)}" width="${bw}" height="${H-30-yp(v)}" fill="#4472C4"/>`); fc.forEach((x,k)=>svg+=`<rect x="${xp(vals.length+k)-bw/2}" y="${yp(x.f)}" width="${bw}" height="${H-30-yp(x.f)}" fill="#ED7D31"/>`); }
    api.q("#fkPrev").innerHTML=svg+`</svg>`; }
  api.q("#fkEnd").addEventListener("input",prev); api.q("#fkL").onclick=()=>{ kind="line"; prev(); }; api.q("#fkC").onclick=()=>{ kind="col"; prev(); };
  function create(){ const e=endVal(); if(!e||e<=last){ xlAlert("La date de fin de la prévision doit être postérieure à la dernière date de la chronologie.","warn"); return false; }
    const fc=series(e); const name=uniqueSheetName("Feuil");
    mutate(()=>{ const ns=insertSheet(name,X.sheet); const C=ns.cells; const heads=[dh,vh,"Prévision("+vh+")","Limite de confiance inférieure("+vh+")","Limite de confiance supérieure("+vh+")"];
      heads.forEach((h,i)=>C[A1(1,i+1)]={v:h}); const dn=(X.wb.cell(s.name,r0,g.c1)||{}).nf||NF.DATE;
      vals.forEach((v,i)=>{ C[A1(2+i,1)]={v:dates[i],nf:dn}; C[A1(2+i,2)]={v}; if(i===vals.length-1){ C[A1(2+i,3)]={v,nf:"0"}; C[A1(2+i,4)]={v,nf:"0"}; C[A1(2+i,5)]={v,nf:"0"}; } });
      fc.forEach((x,k)=>{ const r=2+vals.length+k; C[A1(r,1)]={v:x.d,nf:dn}; C[A1(r,3)]={v:Math.round(x.f*100)/100,nf:"0"}; C[A1(r,4)]={v:Math.round(x.lo*100)/100,nf:"0"}; C[A1(r,5)]={v:Math.round(x.hi*100)/100,nf:"0"}; });
      ns.colW={1:100,2:100,3:150,4:250,5:250};
      const lastRow=1+vals.length+fc.length; let tn=1; while(X.wb.tables["Tableau"+tn]) tn++;

      ns.forecast={end:e,src:fullRefStr(s.name,g,true)};
      X.sheet=name; X.sel={r1:1,c1:1,r2:1,c2:1}; X.act={r:1,c:1}; X.wb.log.push({a:"forecast"});

function convertTableToRange(){

      for(let r=g.r1;r<=g.r2;r++) for(let c=g.c1;c<=g.c2;c++){ const o=st.get(r+","+c); if(!o) continue; const k=A1(r,c); const cl=s.cells[k]||(s.cells[k]={}); if(o.bg&&cl.bg==null) cl.bg=o.bg; if(o.fc&&cl.fc==null) cl.fc=o.fc; if(o.b&&cl.b==null) cl.b=true; }

const REF_ANY=/((?:'(?:[^']|'')+'|[A-Za-zÀ-ÿ_][\wÀ-ÿ.]*)!)?(\$?)([A-Z]{1,3})(\$?)(\d+)(?::(\$?)([A-Z]{1,3})(\$?)(\d+))?/g;
function adjustFormulaRefs(f,fSheet,target,axis,at,n){
  let out="", i=0;
  while(i<f.length){
    const ch=f[i];
    if(ch==='"'){ const j=f.indexOf('"',i+1); const k=j<0?f.length:j+1; out+=f.slice(i,k); i=k; continue; }
    REF_ANY.lastIndex=i; const m=REF_ANY.exec(f);
    if(m&&m.index===i&&!/[A-Za-z0-9_.À-ÿ]/.test(f[i-1]||"")&&!/[A-Za-z0-9_(À-ÿ]/.test(f[i+m[0].length]||"")){
      const sheetTxt=m[1]?m[1].slice(0,-1).replace(/^'|'$/g,"").replace(/''/g,"'"):fSheet;
      if(sheetTxt!==target){ out+=m[0]; i+=m[0].length; continue; }
      let c1=colToIndex(m[3]), r1=+m[5], c2=m[7]?colToIndex(m[7]):c1, r2=m[9]?+m[9]:r1; const isRange=!!m[7];
      const adj=(v)=>{ if(n>0) return v>=at?v+n:v; const d=-n; if(v>=at+d) return v-d; if(v>=at) return null; return v; };
      let ok=true;
      if(axis==="rows"){ if(isRange){ let a=r1>=at&&r1<at-n&&n<0?at:adj(r1), b=adj(r2); if(n<0&&b==null) b=at-1; if(a==null) a=at; if(b<a) ok=false; r1=a; r2=b; } else { const v=adj(r1); if(v==null) ok=false; else r1=r2=v; } }
      else { if(isRange){ let a=c1>=at&&c1<at-n&&n<0?at:adj(c1), b=adj(c2); if(n<0&&b==null) b=at-1; if(a==null) a=at; if(b<a) ok=false; c1=a; c2=b; } else { const v=adj(c1); if(v==null) ok=false; else c1=c2=v; } }
      if(!ok){ out+=(m[1]||"")+"#REF!"; i+=m[0].length; continue; }
      out+=(m[1]||"")+m[2]+indexToCol(c1)+m[4]+r1+(isRange?":"+(m[6]||"")+indexToCol(c2)+(m[8]||"")+r2:"");
      i+=m[0].length; continue;
    }
    const w=/^[A-Za-zÀ-ÿ_][\wÀ-ÿ.]*/.exec(f.slice(i)); if(w&&!/[A-Za-z0-9_.À-ÿ]/.test(f[i-1]||"")&&f[i+w[0].length]!=="!"){ out+=w[0]; i+=w[0].length; continue; }

}
function adjustRangeStr(str,axis,at,n,sheet){ return String(str).split(/([;, ])/).map(p=>{ if(!parseRangeStr(p)) return p; const r=adjustFormulaRefs(p,sheet,sheet,axis,at,n); return r.includes("#REF!")?"":r; }).join("").replace(/^[;, ]+|[;, ]+$/g,""); }

    while((m=re.exec(cl.f.replace(/"[^"]*"/g,"")))){ const g=parseRangeStr(m[0]); if(!g) continue; const q=rectOf(g); h+=`<div class="ref-box" style="left:${q.x}px;top:${q.y}px;width:${q.w}px;height:${q.h}px;border-color:#0070C0"></div>`; const x1=q.x+q.w/2, y1=q.y+q.h/2, x2=A.x+8, y2=A.y+A.h/2; h+=`<svg style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:9" width="1" height="1"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0070C0" stroke-width="1.5"/><circle cx="${x1}" cy="${y1}" r="3" fill="#0070C0"/><path d="M${x2} ${y2} l-7 -4 v8 Z" fill="#0070C0" transform="rotate(${Math.atan2(y2-y1,x2-x1)*180/Math.PI} ${x2} ${y2})"/></svg>`; } }
  else { const me=A1(X.act.r,X.act.c); const s=curSheet(); const A=rectOf({r1:X.act.r,c1:X.act.c,r2:X.act.r,c2:X.act.c}); let n=0; for(const k in s.cells){ const c=s.cells[k]; if(!c.f) continue; const re=/\$?([A-Z]{1,3})\$?(\d+)(?::\$?([A-Z]{1,3})\$?(\d+))?/g; let m; while((m=re.exec(c.f))){ const g=parseRangeStr(m[0]); if(g&&X.act.r>=g.r1&&X.act.r<=g.r2&&X.act.c>=g.c1&&X.act.c<=g.c2){ const p=parseA1(k); const q=rectOf({r1:p.r,c1:p.c,r2:p.r,c2:p.c}); h+=`<svg style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:9" width="1" height="1"><line x1="${A.x+A.w/2}" y1="${A.y+A.h/2}" x2="${q.x+8}" y2="${q.y+q.h/2}" stroke="#0070C0" stroke-width="1.5"/><circle cx="${A.x+A.w/2}" cy="${A.y+A.h/2}" r="3" fill="#0070C0"/></svg>`; n++; break; } } } if(!n){ xlAlert("Aucune formule ne fait référence à la cellule active.","info"); return; } }
  host.innerHTML=h; }
function errorCheck(){ const s=curSheet(); const L=Object.keys(s.cells).map(k=>parseA1(k)).filter(p=>isErr(X.wb.getValue(s.name,p.r,p.c))).sort((a,b)=>a.r-b.r||a.c-b.c); if(!L.length){ xlAlert("La vérification des erreurs est terminée pour toute la feuille.","info"); return; }
  const p=L[0]; setSel(p.r,p.c,p.r,p.c); const v=X.wb.getValue(s.name,p.r,p.c);
  openDlg({title:"Vérification des erreurs",w:460,body:`<div><b>Erreur dans la cellule ${A1(p.r,p.c)}</b></div><div style="margin:6px 0;font-family:var(--f-mono)">${esc(X.wb.displayRaw(s.name,p.r,p.c))}</div><div><b>Erreur ${esc(v.code)}</b></div><p class="small">${{"#DIV/0!":"La formule ou fonction utilisée divise par zéro ou par une cellule vide.","#N/A":"Une valeur n'est pas disponible pour la formule ou la fonction.","#NOM?":"La formule contient du texte non reconnu.","#VALEUR!":"Une valeur utilisée dans la formule est d'un type de données incorrect.","#REF!":"La formule fait référence à des cellules non valides.","#PROPAGATION!":"La plage de propagation n'est pas vide."}[v.code]||""}</p>`,buttons:[{t:"Modifier dans la barre de formule",fn:()=>{ setTimeout(()=>startEdit(null,"edit"),0); }},{t:"Ignorer l'erreur"},{t:"Fermer",def:true}]}); }

function circleInvalid(){ const s=curSheet(); let h=""; (s.dv||[]).forEach(d=>ruleRanges(d).forEach(g=>{ for(let r=g.r1;r<=g.r2;r++) for(let c=g.c1;c<=g.c2;c++){ const v=X.wb.getValue(s.name,r,c); if(!dvCheck(X.wb,s,d,v)){ const q=rectOf({r1:r,c1:c,r2:r,c2:c}); h+=`<div class="ref-box" style="left:${q.x-3}px;top:${q.y-2}px;width:${q.w+6}px;height:${q.h+4}px;border-color:#E81123;border-radius:50%"></div>`; } } })); $("ovRefs").innerHTML=h; if(!h) toast("Aucune donnée non valide."); }

'use strict';

/* ---------- encodage des convocations (lien autonome) ---------- */
function fnv(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36).padStart(7,"0"); }
function encConv(o){ const bytes=new TextEncoder().encode(JSON.stringify(o)); let n=1n; for(const b of bytes) n=(n<<8n)|BigInt(b); const body=n.toString(36); return body+"-"+fnv("certinova:"+body); }
function decConv(code){
  try{ code=String(code||"").trim().replace(/^.*#/,"").replace(/^c-/i,"").replace(/\s+/g,"");
    const k=code.lastIndexOf("-"); if(k<1) return null; const body=code.slice(0,k).toLowerCase(), ck=code.slice(k+1).toLowerCase();
    if(fnv("certinova:"+body)!==ck) return null;
    let n=0n; for(const ch of body){ const d=parseInt(ch,36); if(isNaN(d)) return null; n=n*36n+BigInt(d); }
    const bytes=[]; while(n>255n){ bytes.unshift(Number(n&255n)); n>>=8n; } if(n!==1n) return null;
    const o=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes))); return o&&o.v===1&&EXAMS.some(x=>x.id===o.e)?o:null; }catch(e){ return null; }
}
function isWebUrl(u){ return /^https?:\/\//i.test(String(u||"")); }
/* Adresse placée devant le code : jamais un fichier local (file://), qui n'existe que sur l'ordinateur du formateur */
const PUBLIC_URL="https://wendpanganass.github.io/certinova/";
function baseUrl(){ const s=store.get("baseUrl",""); if(isWebUrl(s)) return s; if(RUNTIME) return PUBLIC_URL; const here=location.href.split("#")[0].split("?")[0]; return isWebUrl(here)&&!/^https?:\/\/(localhost|127\.0\.0\.1)/i.test(here)?here:PUBLIC_URL; }
function freshLink(c){ const o={}; Object.keys(c).forEach(k=>{ if(k!=="link"&&k!=="t") o[k]=c[k]; }); return convLink(o); }
function convLink(o){ return baseUrl()+"#c-"+encConv(o); }
function newId(){ return Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,6); }
function serialFromIso(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); return m?dateSerial(+m[1],+m[2],+m[3]):null; }
function fmtSerial(s){ return formatValue(s,NF.DATE).text; }

/* ---------- accès formateur ---------- */
function normPin(s){ return String(s||"").normalize("NFC").trim(); }
/* empreinte calculée en JavaScript pur : identique quel que soit le navigateur ou le mode d'ouverture du fichier */
function pinHash(s){ let a=0x811c9dc5, b=0x9747b28c, str="certinova|"+s; for(let r=0;r<2000;r++){ for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); a=Math.imul(a^c,0x01000193)>>>0; b=Math.imul(b^c^(a>>>7),0x5bd1e995)>>>0; } str=a.toString(36)+b.toString(36); } return "v2:"+a.toString(36)+b.toString(36); }
async function pinMatches(v,h){ const p=normPin(v); if(!h) return false; if(h===pinHash(p)) return true; for(const x of [p,v]){ if(h==="plain:"+x) return true; const old=await sha(x); if(old===h) return true; } return false; }
async function sha(s){ try{ const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("certinova|"+s)); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return "plain:"+s; } }

/* ---------- côté candidat : ouverture d'une convocation ---------- */
function convState(o){
  if(REVOKED.includes(o.i)) return {ok:false,msg:"Cette convocation a été annulée par votre formateur."};
  if(o.x!=null&&todaySerial()>o.x) return {ok:false,msg:"La date limite de cette convocation ("+fmtSerial(o.x)+") est dépassée."};
  const used=store.get("used:"+o.i,0); if(o.a&&used>=o.a) return {ok:false,msg:o.a===1?"Vous avez déjà composé avec cette convocation.":"Vous avez utilisé les "+o.a+" tentatives autorisées."};
  return {ok:true};
}

    ${st.ok?`<form id="cvForm" class="cn-card" style="box-shadow:none;border:1px solid var(--cn-line);margin-top:16px"><div class="field"><label for="cvName">Nom et prénom</label><input id="cvName" required value="${escA(o.n||store.get("lastName",""))}"${o.n?" readonly":""}></div><button class="btn btn-star btn-block" type="submit">Continuer vers les consignes</button></form>`:`<div class="fb ko" style="margin-top:16px">${esc(st.msg)}</div>`}

const E={mode:"exam",candidate:"",group:"",duration:3000,remaining:3000,elapsed:0,pi:0,ti:0,order:[],wbs:{},undo:{},status:{},started:false,timer:null,tpScale:1,tpH:null,finished:null,feedback:{}};
const store={ get(k,d){ try{ const v=localStorage.getItem("certinova:"+k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem("certinova:"+k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem("certinova:"+k); }catch(e){} } };
let DB=null, USER=null, CAN_ADMIN=false;
(async()=>{ try{ if(window.claude&&window.claude.use){ DB=await window.claude.use("db"); USER=await window.claude.use("user"); if(USER){ try{ CAN_ADMIN=!!(await USER.canEdit())||!!(await USER.isOwner()); }catch(e){} } await loadConfig(); updateAdminUi(); if(!$("scr-home").hidden&&restricted()) renderHome(); renderHomeExtras(); } }catch(e){ DB=null; } })();

function show(id){ ["scr-home","scr-brief","scr-exam","scr-review","scr-results","scr-trainer","scr-conv"].forEach(s=>{ const el=$(s); if(el) el.hidden=s!==id; }); window.scrollTo(0,0); }
function fmtClock(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function domChips(p){ const d=[...new Set(p.taches.map(t=>t.dom))]; return d.map(k=>`<span class="chip">${esc({OPT:"Options",DATA:"Données",FORM:"Formules & macros",CHART:"Graphiques & TCD"}[k])}</span>`).join(""); }
function cnModal(title,html,buttons,onMount){ const b=document.createElement("div"); b.className="cn-modal-back"; b.innerHTML=`<div class="cn-modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${html}<div class="acts">${buttons.map((x,i)=>`<button class="btn ${x.cls||"btn-line"}" data-mb="${i}">${esc(x.t)}</button>`).join("")}</div></div>`; document.body.appendChild(b); const close=()=>b.remove(); b.querySelectorAll("[data-mb]").forEach(el=>el.onclick=()=>{ const r=buttons[+el.dataset.mb].fn&&buttons[+el.dataset.mb].fn(b); if(r!==false) close(); }); b.addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Escape") close(); }); if(onMount) onMount(b); const f=b.querySelector("input,textarea,.btn"); if(f) setTimeout(()=>f.focus(),0); return b; }

let EXAM=EXAMS[0], PJ=EXAM.projects;
function setExam(id){ EXAM=EXAMS.find(x=>x.id===id)||EXAMS[0]; PJ=EXAM.projects; }
function examTitle(id){ const x=EXAMS.find(e=>e.id===id); return x?x.titre:"Examen blanc n° 1"; }

function renderHomeExtras(){

function renderBrief(){
  const nP=E.order.length, nT=E.order.reduce((n,i)=>n+PJ[i].taches.length,0);
  $("scr-brief").innerHTML=`<div class="brief">${brandLogo(46)}<h1>Bienvenue, ${esc(E.candidate)}</h1><p class="muted">${esc(EXAM.titre)} · ${E.mode==="exam"?"chronométré":"entraînement"} · ${nP} projet${nP>1?"s":""} · ${nT} tâches · ${E.duration?Math.round(E.duration/60)+" minutes":"sans limite de temps"}</p>
  <div class="mock">${tutorialSvg()}</div>
  <div class="brief-grid">
    <div class="brief-card"><h4>Le classeur</h4><p>Chaque projet ouvre un classeur différent. Travaillez comme dans Excel : ruban, barre de formule, clic droit, raccourcis (<span class="k">Ctrl+1</span>, <span class="k">F2</span>, <span class="k">F4</span>, <span class="k">Ctrl+Z</span>, <span class="k">Alt+=</span>).</p></div>
    <div class="brief-card"><h4>Le panneau des tâches</h4><p>Les tâches sont indépendantes et peuvent être réalisées dans l'ordre de votre choix. Utilisez <b>Marquer comme terminée</b> et <b>Marquer pour révision</b> pour vous organiser.</p></div>
    <div class="brief-card"><h4>La notation</h4><p>Seul le résultat compte : le correcteur vérifie l'état final du classeur. Une tâche partiellement réalisée est comptée comme non réussie.</p></div>

    <div class="brief-card"><h4>Le temps</h4><p>${E.duration?"Le chronomètre démarre à l'ouverture du premier projet. À zéro, l'examen est soumis automatiquement.":"Aucune limite de temps : prenez le temps de comprendre chaque manipulation."}</p></div>
    <div class="brief-card"><h4>${E.mode==="exam"?"Conditions d'examen":"Aides à l'entraînement"}</h4><p>${E.mode==="exam"?"Aucune aide n'est disponible. Le corrigé détaillé s'affiche avec votre rapport de score.":"Chaque tâche propose un indice, une vérification immédiate et la solution pas à pas."}</p></div>
  </div>
  <label class="agree"><input type="checkbox" id="brOk"> <span>J'ai lu les consignes. Je m'engage à réaliser cet examen blanc seul(e), sans aide extérieure, et à ne pas diffuser son contenu.</span></label>

/* ---------------- déroulement ---------------- */
function getWb(pi){ if(!E.wbs[pi]){ E.wbs[pi]=new Workbook(PJ[pi].build()); E.wbs[pi].options.userName=E.candidate||"Candidat"; E.wbs[pi].props.author=E.candidate||"Candidat"; } return E.wbs[pi]; }
function startExam(){
  if(E.conv){ const st=convState(E.conv); if(!st.ok){ openConvocation(E.conv); return; } store.set("used:"+E.conv.i,store.get("used:"+E.conv.i,0)+1); }
  E.wbs={}; E.undo={}; E.status={}; E.feedback={}; E.pi=E.order[0]; E.ti=0; E.remaining=E.duration; E.elapsed=0; E.started=true; E.finished=null;
  enterExam(); startTimer(); saveSession();
}
function enterExam(){
  show("scr-exam");
  $("scr-exam").innerHTML=`<div id="xlHost" style="flex:1;min-height:0;display:flex;flex-direction:column"></div><div class="splitter" id="tpSplit" title="Faites glisser pour redimensionner"></div><section class="tp" id="tp" aria-label="Panneau des tâches"></section>`;
  if(E.tpH) $("tp").style.height=E.tpH;
  openProject(E.pi,E.ti);
  wireSplitter();
}
function openProject(pi,ti){
  if(X.wb&&E.wbs[E.pi]===X.wb){ E.undo[E.pi]={u:X.undo,r:X.redo,sheet:X.sheet}; }
  E.pi=pi; E.ti=ti||0;
  const wb=getWb(pi);
  xlMount($("xlHost"),wb,{onChange:()=>{ saveSessionSoon(); }});
  const u=E.undo[pi]; if(u){ X.undo=u.u; X.redo=u.r; if(wb.sheet(u.sheet)) { X.sheet=u.sheet; renderAll(); } }
  renderTaskPane();
  setTimeout(()=>$("gs")&&$("gs").focus({preventScroll:true}),30);
}
function startTimer(){
  clearInterval(E.timer);
  E.timer=setInterval(()=>{ if(!E.started) return; E.elapsed++; if(E.duration){ E.remaining--; if(E.remaining===300) toast("Il reste 5 minutes."); if(E.remaining<=0){ E.remaining=0; clearInterval(E.timer); finishExam(true); return; } } updateTimer(); if(E.elapsed%15===0) saveSession(); },1000);
}
function updateTimer(){ const t=$("tpTimer"); if(!t) return; const v=E.duration?E.remaining:E.elapsed; t.querySelector("span:last-child").textContent=fmtClock(v); t.classList.toggle("low",!!E.duration&&E.remaining<=600&&E.remaining>120); t.classList.toggle("crit",!!E.duration&&E.remaining<=120); }
function st(id){ return E.status[id]||(E.status[id]={done:false,flag:false,comment:""}); }
function projPos(){ return E.order.indexOf(E.pi); }
function renderTaskPane(){
  const P=PJ[E.pi]; const T=P.taches[E.ti]; const S=st(T.id); const pos=projPos();
  const tp=$("tp"); tp.style.setProperty("--tp-scale",E.tpScale);
  const fb=E.feedback[T.id];
  tp.innerHTML=`<div class="tp-h"><span class="brand-plate sm">${brandLogo(28)}</span><div class="tp-proj"><b>Projet ${pos+1} sur ${E.order.length} : ${esc(P.titre)}</b><small>${esc(P.classeur)} · ${esc(P.scenario)}</small></div>
    <div class="timer" id="tpTimer" title="${E.duration?"Temps restant":"Temps écoulé"}"><span class="d"></span><span>${fmtClock(E.duration?E.remaining:E.elapsed)}</span></div>
    <button class="tp-btn icon" id="tpSmaller" title="Réduire la taille du texte">A−</button><button class="tp-btn icon" id="tpBigger" title="Agrandir la taille du texte">A+</button>
    <button class="tp-btn" id="tpSummary">Sommaire de l'examen</button><button class="tp-btn" id="tpRestart">Redémarrer le projet</button><button class="tp-btn star" id="tpSubmit">${pos===E.order.length-1?"Soumettre et terminer":"Soumettre le projet"}</button>
    <button class="tp-btn icon" id="tpCollapse" title="Réduire ou agrandir le panneau">${tp.classList.contains("collapsed")?"▴":"▾"}</button></div>
  <div class="tp-tabs" role="tablist">${P.taches.map((t,i)=>{ const s=st(t.id); return `<button class="tp-tab${i===E.ti?" on":""}" role="tab" data-ti="${i}" aria-selected="${i===E.ti}">Tâche ${i+1}${s.done?'<span class="st done" title="Terminée">✔</span>':""}${s.flag?'<span class="st flag" title="À réviser">⚑</span>':""}${s.comment?'<span class="st" title="Commentaire">💬</span>':""}</button>`; }).join("")}</div>
  <div class="tp-body"><div><div class="tp-text">${T.txt}</div>${fb?`<div class="fb ${fb.k}">${fb.h}</div>`:""}</div>
    ${E.mode==="train"?`<div class="tp-train"><button class="tbtn primary" id="trCheck">✓ Vérifier ma réponse</button><button class="tbtn" id="trHint">💡 Indice</button><button class="tbtn" id="trSol">📘 Voir la solution</button><button class="tbtn" id="trSheet">↪ Afficher la feuille « ${esc(T.sheet)} »</button></div>`:""}</div>
  <div class="tp-f"><button class="tp-act${S.done?" on-done":""}" id="tpDone">${S.done?"✔ Terminée":"○ Marquer comme terminée"}</button><button class="tp-act${S.flag?" on-flag":""}" id="tpFlag">${S.flag?"⚑ À réviser":"⚐ Marquer pour révision"}</button><button class="tp-act" id="tpComment">💬 ${S.comment?"Modifier le commentaire":"Laisser un commentaire"}</button><span class="grow"></span><button class="tp-act" id="tpPrev"${E.ti===0?" disabled":""}>‹ Tâche précédente</button><button class="tp-act nav" id="tpNext">${E.ti===P.taches.length-1?"Soumettre le projet ›":"Tâche suivante ›"}</button></div>`;
  tp.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{ E.ti=+b.dataset.ti; renderTaskPane(); });
  $("tpDone").onclick=()=>{ S.done=!S.done; renderTaskPane(); saveSession(); };
  $("tpFlag").onclick=()=>{ S.flag=!S.flag; renderTaskPane(); saveSession(); };
  $("tpComment").onclick=()=>cnModal("Laisser un commentaire",`<p>Votre commentaire sur la tâche ${E.ti+1} sera transmis avec vos résultats. Il n'a aucun effet sur votre score.</p><textarea id="cmT">${esc(S.comment)}</textarea>`,[{t:"Annuler"},{t:"Enregistrer",cls:"btn-night",fn:b=>{ S.comment=b.querySelector("#cmT").value.trim(); renderTaskPane(); saveSession(); }}]);

function gradeAll(){
  const tasks=[]; const dom={}; Object.keys(DOMAINS).forEach(k=>dom[k]=[0,0]);
  E.order.forEach(pi=>{ const P=PJ[pi]; const wb=E.wbs[pi]||null; P.taches.forEach((t,i)=>{ let r={ok:false,msg:"Le projet n'a pas été ouvert."}; if(wb){ try{ r=t.check(wb); }catch(e){ r={ok:false,msg:"Résultat non vérifiable."}; } } dom[t.dom][1]++; if(r.ok) dom[t.dom][0]++; tasks.push({id:t.id,pi,i,ok:!!r.ok,msg:r.msg||"",st:Object.assign({},st(t.id))}); }); });
  const correct=tasks.filter(t=>t.ok).length, total=tasks.length; const score=Math.round(1000*correct/Math.max(1,total));
  return {tasks,dom,correct,total,score,pass:score>=700};
}
function finishExam(auto){

async function saveRemote(rec){
  E.remoteState="pending";
  try{ if(!DB||!USER) throw 0; const id=await USER.id(); if(!id) throw 0; const ref=DB.doc("results/"+id); const snap=await ref.get(); const cur=snap.exists?snap.data():{};
    const attempts=(cur.attempts||[]).concat([rec]).slice(-40); await ref.set({name:rec.name,group:rec.group,updated:rec.date,attempts}); E.remoteState="ok"; }
  catch(e){ E.remoteState="local"; }

}
function syncNote(){ if(E.remoteState==="ok") return `<span class="chip ok">Résultat transmis à votre formateur</span>`; if(E.remoteState==="pending") return `<span class="chip">Transmission en cours…</span>`; return `<span class="chip warn">Enregistré sur cet appareil</span> <span class="small muted">Copiez votre code de résultat et envoyez-le à votre formateur.</span>`; }
function encodeRec(rec){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(rec)))); }catch(e){ return ""; } }
function decodeRec(code){ try{ const o=JSON.parse(decodeURIComponent(escape(atob(code.trim())))); return o&&o.name&&typeof o.score==="number"?o:null; }catch(e){ return null; } }
function gauge(score,pass){ const r=70, c=2*Math.PI*r, p=score/1000; return `<div class="gauge"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14"/><circle cx="85" cy="85" r="${r}" fill="none" stroke="${pass?"#58C98B":"#FF8B76"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/><circle cx="85" cy="85" r="${r}" fill="none" stroke="#F4B740" stroke-width="3" stroke-dasharray="2 ${c.toFixed(1)}" stroke-dashoffset="${(-c*0.7).toFixed(1)}"/></svg><div class="v"><div><b>${score}</b><small>sur 1000</small></div></div></div>`; }

  $("trTableWrap").innerHTML=`<h3 style="margin:0 0 8px;font-family:var(--f-display);font-size:16px">Candidats</h3>`+(cands.length?`<div class="tbl-scroll"><table class="history" style="width:100%;border:none"><tbody><tr><th>Candidat</th><th>Groupe</th><th>Tentatives</th><th>Meilleur score</th><th>Dernier score</th><th>Dernière tentative</th></tr>${cands.map((c,i)=>`<tr data-cand="${i}" style="cursor:pointer"><td><b>${esc(c.name)}</b></td><td>${esc(c.group||"—")}</td><td>${c.n}</td><td>${c.best}</td><td><span class="chip ${c.last.pass?"ok":"bad"}">${c.last.score}</span></td><td>${new Date(c.last.date).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Aucun résultat pour l'instant. Partagez le lien de CERTINOVA avec vos candidats : leurs scores apparaîtront ici, ou collez les codes qu'ils vous envoient.</p>`);
  document.querySelectorAll("[data-cand]").forEach(tr=>tr.onclick=()=>{ const c=cands[+tr.dataset.cand];
    cnModal(c.name,`<p>${esc(c.group||"Sans groupe")} · ${c.n} tentative(s)</p><div class="history tbl-scroll"><table><tr><th>Date</th><th>Mode</th><th>Score</th><th>Tâches</th><th>Durée</th><th>Certificat</th></tr>${c.L.slice().reverse().map(r=>`<tr><td>${new Date(r.date).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</td><td>${r.mode==="exam"?"Examen":"Entraînement"}</td><td><b>${r.score}</b></td><td>${r.correct}/${r.total}</td><td>${fmtClock(r.time)}</td><td>${certEligible(r)?`<button class="btn btn-line" style="padding:4px 10px;font-size:12.5px" data-certid="${escA(r.id)}">Certificat</button>`:"—"}</td></tr>`).join("")}</table></div>${(c.last.comments||[]).length?`<p style="margin-top:10px"><b>Commentaires :</b></p>${c.last.comments.map(x=>`<p class="small">• ${esc(taskLabel(x.id))}<br>« ${esc(x.c)} »</p>`).join("")}`:""}`,[{t:"Fermer",cls:"btn-night"}]); });
}

/* ---------------- démarrage ---------------- */
function boot(){ const o=/^#c-/i.test(location.hash)?decConv(location.hash):null; if(o){ openConvocation(o); return; } renderHome(); show("scr-home"); }
window.addEventListener("hashchange",()=>{ const o=/^#c-/i.test(location.hash)?decConv(location.hash):null; if(o&&!E.started) openConvocation(o); });
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

</script>
</body>
