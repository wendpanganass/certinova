<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CERTINOVA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CERTINOVA : examen blanc Excel Expert (MO-211) dans un environnement fidÃ¨le au centre d'examen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Sora:wght@500;600;700&display=swap">
<style>
/* CERTINOVA — mise en page : écrans de préparation sur fond « nuit étoilée », tableur clair plein écran, panneau d'examen ancré en bas */
:root{
  --cn-ink:#071D40; --cn-night:#0B2F66; --cn-night-2:#104FA2; --cn-night-3:#1D63C4;
  --cn-star:#0094DA; --cn-star-d:#007DBF; --cn-mist:#E8EDF4; --cn-paper:#F6F7F9; --cn-card:#FFFFFF;
  --cn-text:#1C2633; --cn-muted:#5B6878; --cn-line:#D6DDE6; --cn-ok:#24855A; --cn-warn:#B86E00; --cn-bad:#B83A2E; --cn-focus:#2F6FDB;
  --xl-green:#217346; --xl-green-d:#185C37; --xl-green-l:#E3F0E8; --xl-tabs:#F3F2F1; --xl-ribbon:#FAFAFA; --xl-line:#D2D0CE;
  --xl-head:#F3F3F3; --xl-head-sel:#D6D6D6; --xl-grid:#E2E2E2; --xl-text:#252423; --xl-hover:#E1DFDD; --xl-press:#C8C6C4; --xl-muted:#605E5C;
  --xl-sel-fill:rgba(33,115,70,.10); --dlg-bg:#F0F0F0; --dlg-line:#ADADAD; --dlg-btn:#E1E1E1; --dlg-accent:#0078D4;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif; --f-ui:"Segoe UI","Segoe UI Variable Text",system-ui,-apple-system,Roboto,Arial,sans-serif; --f-mono:Consolas,"Cascadia Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cn-paper);color:var(--cn-text);font-family:var(--f-ui);font-size:14px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--cn-focus);outline-offset:1px}
.screen{min-height:100%;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* ================= marque CERTINOVA ================= */
.cn-logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:15px;color:#fff}
.cn-logo svg{width:26px;height:26px;flex:none}
.cn-top{display:flex;align-items:center;gap:16px;padding:18px 0;color:#fff;flex-wrap:wrap}
.cn-top .grow{flex:1}
.cn-hero{background:radial-gradient(1200px 420px at 85% -10%,#2A5287 0%,transparent 60%),linear-gradient(180deg,var(--cn-night) 0%,var(--cn-ink) 100%);color:#fff;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.cn-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 12% 30%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 20%,rgba(255,255,255,.4) 0 1px,transparent 1.5px),radial-gradient(circle at 40% 70%,rgba(255,255,255,.35) 0 1px,transparent 1.5px),radial-gradient(circle at 88% 64%,rgba(255,255,255,.45) 0 1px,transparent 1.5px);background-size:220px 160px,310px 190px,260px 210px,350px 240px;pointer-events:none;opacity:.7}
.cn-wrap{max-width:1120px;margin:0 auto;position:relative}
.cn-hero-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;padding:26px 0 46px;align-items:start}
@media (max-width:880px){.cn-hero-body{grid-template-columns:1fr;gap:24px}}
.cn-eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cn-star);font-weight:600}
.cn-h1{font-family:var(--f-display);font-size:clamp(28px,4.2vw,44px);line-height:1.12;margin:12px 0 14px;text-wrap:balance;font-weight:700}
.cn-lead{color:#C9D5E6;line-height:1.6;max-width:60ch;font-size:15.5px;margin:0}
.cn-facts{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.cn-facts div{font-size:12.5px;color:#A9B9CF}
.cn-facts b{display:block;font-family:var(--f-display);font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.cn-card{background:var(--cn-card);color:var(--cn-text);border-radius:14px;padding:24px;box-shadow:0 18px 50px rgba(5,14,30,.35)}
.cn-card h2{font-family:var(--f-display);font-size:19px;margin:0 0 4px}
.cn-card .sub{color:var(--cn-muted);font-size:13px;margin:0 0 18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--cn-muted)}
.field input,.field select{font:inherit;padding:10px 12px;border:1px solid var(--cn-line);border-radius:8px;background:#fff;color:var(--cn-text)}
.field input:focus,.field select:focus{outline:2px solid var(--cn-focus);border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--cn-line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--cn-text);font-size:13px;line-height:1.35}
.seg label b{display:block;font-size:14px}
.seg input{margin-top:3px;accent-color:var(--cn-night-3)}
.seg label:has(input:checked){border-color:var(--cn-night-3);background:#EEF3FA;box-shadow:inset 0 0 0 1px var(--cn-night-3)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-star{background:var(--cn-star);color:#2A1C00}
.btn-star:hover{background:#FFC555}
.btn-night{background:var(--cn-night-2);color:#fff}
.btn-night:hover{background:var(--cn-night-3)}
.btn-ghost{background:transparent;color:inherit;border-color:currentColor}
.btn-line{background:#fff;color:var(--cn-text);border-color:var(--cn-line)}
.btn-line:hover{border-color:var(--cn-night-3)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.cn-section{max-width:1120px;margin:0 auto;padding:36px 0}
.cn-section h3{font-family:var(--f-display);font-size:18px;margin:0 0 14px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.proj{background:#fff;border:1px solid var(--cn-line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.proj .num{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cn-muted);font-weight:600}
.proj h4{margin:0;font-size:15.5px;font-family:var(--f-display)}
.proj .file{font-family:var(--f-mono);font-size:12px;color:var(--xl-green)}
.proj .doms{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:11.5px;border-radius:999px;padding:3px 9px;background:var(--cn-mist);color:var(--cn-night-2);font-weight:600;white-space:nowrap}
.chip.ok{background:#E2F2EA;color:var(--cn-ok)} .chip.bad{background:#F8E5E2;color:var(--cn-bad)} .chip.warn{background:#FBEFD9;color:var(--cn-warn)}
.history{background:#fff;border:1px solid var(--cn-line);border-radius:12px;overflow:hidden}
.history table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.history th,.history td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--cn-line)}
.history th{background:var(--cn-mist);font-size:12px;color:var(--cn-muted);font-weight:600}
.history tr:last-child td{border-bottom:none}
.tbl-scroll{overflow-x:auto}
.muted{color:var(--cn-muted)}
.small{font-size:12.5px}
.cn-foot{max-width:1120px;margin:0 auto;padding:24px 0 40px;color:var(--cn-muted);font-size:12.5px;border-top:1px solid var(--cn-line)}

/* ================= consignes / tutoriel ================= */
.brief{max-width:980px;margin:0 auto;padding:30px 0 50px}
.brief h1{font-family:var(--f-display);font-size:26px;margin:6px 0 4px}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:22px 0}
.brief-card{background:#fff;border:1px solid var(--cn-line);border-radius:12px;padding:18px}
.brief-card h4{margin:0 0 6px;font-size:14.5px}
.brief-card p{margin:0;color:var(--cn-muted);font-size:13.5px;line-height:1.55}
.brief-card .k{font-family:var(--f-mono);font-size:12px;background:var(--cn-mist);border-radius:4px;padding:1px 6px;color:var(--cn-text)}
.mock{background:#fff;border:1px solid var(--cn-line);border-radius:12px;overflow:hidden;margin-top:8px}
.mock svg{display:block;width:100%;height:auto}
.agree{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--cn-line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.5}

/* ================= écran d'examen ================= */
#scr-exam{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;padding:0;z-index:5}
.xl{flex:1;min-height:120px;display:flex;flex-direction:column;color:var(--xl-text);font-size:12px;font-family:var(--f-ui);user-select:none;-webkit-user-select:none;position:relative}
.xl-title{height:34px;background:var(--xl-green);color:#fff;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;flex:none;font-size:12px}
.xl-title .qa{display:flex;align-items:center;gap:2px}
.xl-title .qa button{background:none;border:none;color:#fff;width:28px;height:26px;border-radius:3px;cursor:pointer;display:grid;place-items:center}
.xl-title .qa button:hover{background:rgba(255,255,255,.16)}
.xl-title .qa svg{width:16px;height:16px}
.autosave{display:flex;align-items:center;gap:6px;margin-right:6px;font-size:11.5px;white-space:nowrap}
.toggle{width:30px;height:14px;border-radius:7px;border:1px solid #fff;position:relative;cursor:pointer;background:transparent}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:#fff}.toggle.on::after{left:18px;background:var(--xl-green)}
.xl-title .doc{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.xl-title .search{background:rgba(255,255,255,.92);color:var(--xl-muted);border-radius:4px;height:24px;width:min(300px,28vw);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px}
.xl-title .search svg{width:14px;height:14px}
.xl-title .win{display:flex}
.xl-title .win span{width:40px;height:34px;display:grid;place-items:center;opacity:.95}
.xl-title .avatar{width:24px;height:24px;border-radius:50%;background:#F4B740;color:#2A1C00;font-weight:700;font-size:10.5px;display:grid;place-items:center;margin:0 4px}
@media (max-width:760px){.xl-title .search,.xl-title .win,.autosave span{display:none}}
.xl-tabs{display:flex;align-items:flex-end;background:var(--xl-tabs);height:30px;flex:none;padding:0 6px;gap:1px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.xl-tabs::-webkit-scrollbar{display:none}
.xl-tab{border:none;background:none;padding:0 11px;height:28px;font-size:12.5px;color:var(--xl-text);cursor:pointer;white-space:nowrap;position:relative;border-radius:3px 3px 0 0}
.xl-tab:hover{background:var(--xl-hover)}
.xl-tab.on{color:var(--xl-green);font-weight:600}
.xl-tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--xl-green);border-radius:2px}
.xl-tab.file{background:var(--xl-green);color:#fff;font-weight:600;margin-right:4px;border-radius:3px}
.xl-tab.file:hover{background:var(--xl-green-d)}
.xl-tab.ctx{color:#7A4C00;font-weight:600}
.xl-tab.ctx.on{color:var(--xl-green)}
.xl-tab-spacer{flex:1}
.xl-tab-right{display:flex;gap:4px;align-items:center;height:28px}
.xl-tab-right button{border:1px solid var(--xl-line);background:#fff;border-radius:4px;height:24px;font-size:12px;padding:0 10px;cursor:pointer;display:flex;align-items:center;gap:5px}
.xl-tab-right button.share{background:var(--xl-green);border-color:var(--xl-green);color:#fff}
.xl-ribbon{background:var(--xl-ribbon);border-bottom:1px solid var(--xl-line);height:96px;display:flex;align-items:stretch;flex:none;overflow-x:auto;overflow-y:hidden;padding:3px 4px 0}
.rg{display:flex;flex-direction:column;padding:0 4px;border-right:1px solid #E1DFDD;flex:none}
.rg-body{display:flex;align-items:flex-start;gap:2px;flex:1;padding-top:1px}
.rg-title{font-size:11px;color:var(--xl-muted);text-align:center;padding:2px 0 3px;white-space:nowrap;position:relative}
.rg-title .launch{position:absolute;right:-2px;bottom:3px;width:11px;height:11px;cursor:pointer;opacity:.7}
.rcol{display:flex;flex-direction:column;gap:1px}
.rrow{display:flex;gap:1px;align-items:center}
.rb{border:1px solid transparent;background:none;border-radius:3px;cursor:pointer;color:var(--xl-text);font-size:11.5px;display:flex;align-items:center;gap:4px;padding:2px 4px;white-space:nowrap;line-height:1.15;position:relative}
.rb:hover{background:var(--xl-hover)}
.rb:active,.rb.on{background:var(--xl-press)}
.rb.big{flex-direction:column;justify-content:flex-start;height:68px;min-width:46px;max-width:78px;padding:3px 4px;white-space:normal;text-align:center;gap:3px}
.rb.big svg{width:32px;height:32px;flex:none}
.rb.big .lbl{display:block;max-width:74px}
.rb.sm{height:22px}
.rb.sm svg{width:16px;height:16px;flex:none}
.rb.ico{width:24px;justify-content:center;padding:0}
.rb .dd{font-size:8px;color:var(--xl-muted);margin-left:1px}
.rb[disabled]{opacity:.45;cursor:default}
.rsel{height:22px;border:1px solid #C8C6C4;border-radius:2px;background:#fff;font-size:11.5px;padding:0 4px;font-family:inherit}
.rchk{display:flex;align-items:center;gap:5px;font-size:11.5px;height:21px;white-space:nowrap;cursor:pointer;padding:0 3px}
.rchk input{margin:0;accent-color:var(--xl-green)}
.rinput{height:22px;border:1px solid #C8C6C4;font-size:11.5px;padding:0 4px;width:120px;font-family:inherit}
.rlabel{font-size:11.5px;padding:0 3px}
.rgallery{display:flex;gap:3px;border:1px solid #D2D0CE;background:#fff;padding:3px;height:64px;align-items:center}
.rgallery .gi{width:46px;height:54px;border:1px solid transparent;cursor:pointer;display:grid;place-items:center;border-radius:2px}
.rgallery .gi:hover{border-color:var(--xl-green);background:var(--xl-green-l)}
.xl-msg{display:flex;align-items:center;gap:10px;background:#FFF4CE;border-bottom:1px solid #E5D28B;padding:5px 12px;font-size:12px;flex:none}
.xl-msg b{color:#6E5200}
.xl-msg button{border:1px solid #8A8886;background:#fff;font-size:12px;padding:2px 10px;cursor:pointer}
.xl-msg .x{margin-left:auto;border:none;background:none;cursor:pointer;font-size:14px}
.xl-fbar{display:flex;align-items:center;height:28px;border-bottom:1px solid var(--xl-line);background:#fff;flex:none;gap:0}
.namebox{width:104px;height:22px;margin:0 2px 0 4px;border:1px solid #C8C6C4;font-size:12px;padding:0 6px;font-family:var(--f-ui)}
.fx-btns{display:flex;align-items:center;gap:2px;padding:0 6px;color:#8A8886;border-right:1px solid #E1DFDD;height:100%}
.fx-btns button{border:none;background:none;width:22px;height:22px;cursor:pointer;color:#605E5C;border-radius:2px;display:grid;place-items:center}
.fx-btns button:hover{background:var(--xl-hover)}
.fx-btns button[disabled]{opacity:.3;cursor:default}
.fx-btns .fxi{font-style:italic;font-family:Cambria,Georgia,serif;font-size:14px;font-weight:600;color:#444}
.fbar-input{flex:1;height:100%;border:none;font-family:var(--f-ui);font-size:12.5px;padding:0 8px;outline:none;user-select:text;-webkit-user-select:text}
.xl-main{flex:1;display:flex;min-height:0;position:relative}
.gridscroll{flex:1;overflow:auto;position:relative;background:#fff;outline:none}
.kb-sink{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none;overflow:hidden;z-index:0;pointer-events:none}
.xl-ribbon{scrollbar-width:thin;height:104px;align-items:flex-start}
.rg{height:92px}
.rg-body{min-height:0;overflow:hidden}
.rb.big{height:66px}
.rb.big svg{width:30px;height:30px}
.rb.big .lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:80px}
.gridcontent{position:relative}
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:14.6px;color:#000}
table.g td{border-right:1px solid var(--xl-grid);border-bottom:1px solid var(--xl-grid);height:20px;padding:0 3px;white-space:nowrap;overflow:hidden;position:relative;line-height:19px;vertical-align:bottom;background:#fff}
table.g.nogrid td{border-color:transparent}
table.g th{background:var(--xl-head);color:#444;font-weight:400;font-size:11.5px;font-family:var(--f-ui);border-right:1px solid #D4D4D4;border-bottom:1px solid #D4D4D4;position:sticky;z-index:3;text-align:center;padding:0}
table.g thead th{top:0;height:20px}
table.g tbody th{left:0;z-index:2}
table.g th.corner{left:0;top:0;z-index:4;background:var(--xl-head)}
table.g th.corner::after{content:"";position:absolute;right:3px;bottom:3px;border-left:9px solid transparent;border-bottom:9px solid #B3B0AD}
table.g th.hs{background:var(--xl-head-sel);color:var(--xl-green);font-weight:600;box-shadow:inset 0 -2px 0 var(--xl-green)}
table.g tbody th.hs{box-shadow:inset -2px 0 0 var(--xl-green)}
table.g th.hfull{background:#9FD5B7;color:#0B3D20}
table.g td.num{text-align:right}
table.g td.ctr{text-align:center}
table.g td.lft{text-align:left}
table.g td .t{position:relative;z-index:1}
table.g td.ov{overflow:visible}
table.g td.ov .t{position:absolute;left:3px;bottom:0;white-space:nowrap;pointer-events:none}
table.g td.ov.num .t{left:auto;right:3px}
table.g td.err{color:#000}
table.g td.wrap{white-space:normal;line-height:1.2}
.cf-bar{position:absolute;left:2px;top:3px;bottom:3px;z-index:0;border-radius:0}
.cf-ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.cf-ico-cell{position:absolute;left:3px;bottom:3px;z-index:1}
.dv-btn{position:absolute;width:17px;height:19px;background:#F3F3F3;border:1px solid #ABABAB;z-index:9;display:grid;place-items:center;cursor:pointer;font-size:9px;color:#333}
.dv-list{position:absolute;z-index:40;background:#fff;border:1px solid #8A8886;box-shadow:0 4px 12px rgba(0,0,0,.18);max-height:200px;overflow:auto;font-family:Calibri,Carlito,Arial,sans-serif;font-size:14px;min-width:120px}
.dv-list div{padding:1px 6px;cursor:default;white-space:nowrap}
.dv-list div:hover,.dv-list div.on{background:#CCE8FF}
.filter-btn{position:absolute;right:1px;bottom:1px;width:16px;height:16px;background:#fff;border:1px solid #ABABAB;display:grid;place-items:center;cursor:pointer;z-index:4}
.filter-btn svg{width:9px;height:9px}
.note-tri{position:absolute;right:0;top:0;border-left:6px solid transparent;border-top:6px solid #C00000;z-index:2}
.sel-box{position:absolute;border:2px solid var(--xl-green);background:var(--xl-sel-fill);pointer-events:none;z-index:6}
.sel-area{position:absolute;background:var(--xl-sel-fill);pointer-events:none;z-index:6;border:1px solid rgba(33,115,70,.5)}
.act-box{position:absolute;border:2px solid var(--xl-green);pointer-events:none;z-index:7;background:transparent}
.fill-h{position:absolute;width:7px;height:7px;background:var(--xl-green);border:1px solid #fff;cursor:crosshair;z-index:8}
.copy-box{position:absolute;pointer-events:none;z-index:7;border:2px dashed var(--xl-green);animation:march 0.6s linear infinite}
@keyframes march{50%{border-color:#7BC496}}
.fill-prev{position:absolute;border:1px dashed #555;pointer-events:none;z-index:7}
.ref-box{position:absolute;pointer-events:none;z-index:6;border:2px solid}
.spill-box{position:absolute;pointer-events:none;z-index:5;border:1px solid #5B9BD5}
.cell-editor{position:absolute;z-index:20;border:2px solid var(--xl-green);background:#fff;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:14.6px;padding:0 2px;outline:none;min-width:60px;white-space:pre;overflow:hidden;line-height:18px;user-select:text;-webkit-user-select:text;color:#000}
.fn-ac{position:fixed;z-index:200;background:#fff;border:1px solid #8A8886;box-shadow:0 6px 16px rgba(0,0,0,.18);max-height:220px;overflow:auto;min-width:260px;font-size:12px}
.fn-ac div{padding:3px 8px;display:flex;gap:8px;cursor:default;align-items:center}
.fn-ac div.on{background:#CCE8FF}
.fn-ac div b{font-weight:600}
.fn-ac .fx{font-style:italic;font-family:Cambria,Georgia,serif;color:#217346;font-weight:700}
.fn-tip{position:fixed;z-index:199;background:#FFFFE1;border:1px solid #767676;font-size:12px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
.fn-tip .cur{font-weight:700}
.fn-desc{position:fixed;z-index:201;background:#fff;border:1px solid #8A8886;font-size:12px;padding:6px 8px;max-width:280px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.chart{position:absolute;background:#fff;border:1px solid #D9D9D9;z-index:10;cursor:move}
.chart.sel{border:1px solid #8A8886;box-shadow:0 0 0 1px #A0A0A0}
.chart svg{display:block;width:100%;height:100%}
.chart .hdl{position:absolute;width:8px;height:8px;background:#fff;border:1px solid #6E6E6E;border-radius:50%;z-index:2}
.chart .side-btns{position:absolute;right:-30px;top:0;display:flex;flex-direction:column;gap:4px}
.chart .side-btns button{width:24px;height:24px;border:1px solid #C8C6C4;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.chart .side-btns svg{width:16px;height:16px}
.xl-pane{width:310px;flex:none;border-left:1px solid var(--xl-line);background:#fff;display:flex;flex-direction:column;min-height:0;font-size:12px}
.pane-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:15px;color:#333}
.pane-h button{border:none;background:none;cursor:pointer;font-size:15px;color:#555}
.pane-b{flex:1;overflow:auto;padding:0 12px 12px}
.pf-search{width:100%;border:1px solid #C8C6C4;height:24px;padding:0 6px;font-size:12px;margin-bottom:6px}
.pf-list{border:1px solid #E1DFDD;max-height:200px;overflow:auto;padding:3px 0}
.pf-item{display:flex;align-items:center;gap:6px;padding:2px 6px;cursor:grab}
.pf-item:hover{background:#F3F2F1}
.pf-item input{margin:0;accent-color:var(--xl-green)}
.pf-areas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pf-area{border:1px solid #E1DFDD;min-height:86px;display:flex;flex-direction:column}
.pf-area .ah{font-size:11.5px;color:#555;padding:3px 6px;display:flex;gap:5px;align-items:center;background:#FAF9F8;border-bottom:1px solid #EDEBE9}
.pf-area .ab{flex:1;padding:3px;display:flex;flex-direction:column;gap:2px}
.pf-area.drop{background:#E9F5EE;border-color:var(--xl-green)}
.pf-chip{background:#F3F2F1;border:1px solid #E1DFDD;padding:2px 6px;display:flex;justify-content:space-between;align-items:center;cursor:grab;font-size:11.5px}
.pf-chip:hover{border-color:#8A8886}
.pf-chip .m{cursor:pointer;padding:0 2px;color:#555}
.fmt-sec{border-top:1px solid #EDEBE9;padding:8px 0}
.fmt-sec h5{margin:0 0 6px;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
.fmt-row{display:flex;align-items:center;gap:6px;margin:5px 0 5px 12px}
.fmt-row label{display:flex;align-items:center;gap:5px}
.fmt-row input[type=number],.fmt-row input[type=text]{width:90px;height:22px;border:1px solid #C8C6C4;font-size:12px;padding:0 4px}
.xl-sheets{height:28px;display:flex;align-items:stretch;background:var(--xl-tabs);border-top:1px solid var(--xl-line);flex:none;font-size:12px}
.sh-nav{display:flex;align-items:center;padding:0 4px;gap:0}
.sh-nav button{border:none;background:none;width:20px;height:22px;cursor:pointer;color:#605E5C}
.sh-list{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;max-width:70%}
.sh-list::-webkit-scrollbar{display:none}
.sh-tab{padding:0 14px;display:flex;align-items:center;cursor:pointer;white-space:nowrap;border-right:1px solid #D2D0CE;position:relative;color:var(--xl-text)}
.sh-tab:hover{background:var(--xl-hover)}
.sh-tab.on{background:#fff;color:var(--xl-green);font-weight:600}
.sh-tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;background:var(--xl-green)}
.sh-tab .tc{position:absolute;left:0;right:0;bottom:0;height:3px}
.sh-tab input{font:inherit;width:120px;border:1px solid var(--xl-green);padding:1px 3px}
.sh-add{border:none;background:none;width:30px;cursor:pointer;color:#605E5C;display:grid;place-items:center}
.sh-add:hover{background:var(--xl-hover)}
.sh-fill{flex:1;border-left:1px solid #D2D0CE;background:#F8F8F8}
.xl-status{height:24px;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--xl-tabs);border-top:1px solid #E1DFDD;font-size:11.5px;color:#444;flex:none;white-space:nowrap;overflow:hidden}
.xl-status .grow{flex:1}
.xl-status .views{display:flex;gap:2px}
.xl-status .views span{width:22px;height:18px;display:grid;place-items:center;border-radius:2px}
.xl-status .views span.on{background:#D6D6D6}
.zoombar{display:flex;align-items:center;gap:6px}
.zoombar input{width:100px;accent-color:#605E5C}
.zoombar button{border:none;background:none;cursor:pointer;font-size:14px;color:#444;width:16px}

/* ================= menus, boîtes de dialogue ================= */
.menu{position:fixed;z-index:300;background:#fff;border:1px solid #C8C6C4;box-shadow:0 8px 22px rgba(0,0,0,.18);padding:4px 0;min-width:200px;font-size:12px;color:var(--xl-text);max-height:80vh;overflow:auto;font-family:var(--f-ui)}
.mi{display:flex;align-items:center;gap:10px;padding:5px 26px 5px 10px;cursor:default;white-space:nowrap;position:relative}
.mi:hover,.mi.hl{background:#E1DFDD}
.mi .ic{width:18px;height:18px;display:grid;place-items:center;flex:none}
.mi .ic svg{width:16px;height:16px}
.mi .sub-arrow{position:absolute;right:8px;font-size:9px;color:#605E5C}
.mi.dis{color:#A19F9D}
.mi.big{padding:6px 26px 6px 10px}
.mi.big .ic{width:32px;height:32px}
.mi.big .ic svg{width:30px;height:30px}
.mi .desc{display:flex;flex-direction:column;gap:1px;white-space:normal;max-width:260px}
.mi .desc small{color:#605E5C}
.msep{height:1px;background:#E1DFDD;margin:3px 0}
.mhead{padding:6px 10px 3px;font-weight:600;color:#444;background:#F3F2F1;font-size:11.5px}
.mgrid{display:grid;gap:4px;padding:6px 10px}
.mgrid .sw{border:1px solid transparent;cursor:pointer;display:grid;place-items:center;padding:2px}
.mgrid .sw:hover{border-color:#E5A000;background:#FFF4CE}
.colorpal{padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.colorpal .row{display:flex;gap:3px}
.colorpal .sw{width:16px;height:16px;border:1px solid #D2D0CE;cursor:pointer}
.colorpal .sw:hover{outline:2px solid #E5A000;outline-offset:0}
.colorpal .lbl{font-size:11.5px;color:#444;margin:4px 0 1px;font-weight:600}
.dlg-layer{position:fixed;inset:0;z-index:250;pointer-events:none}
.dlg-layer.block{pointer-events:auto;background:rgba(0,0,0,.04)}
.dlg{position:absolute;background:var(--dlg-bg);border:1px solid #6E6E6E;box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:12px;color:#000;pointer-events:auto;display:flex;flex-direction:column;max-height:92vh;max-width:96vw;font-family:var(--f-ui)}
.dlg-h{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 10px;background:#fff;cursor:move;flex:none}
.dlg-h .tt{font-size:12px}
.dlg-h .hb{display:flex}
.dlg-h .hb button{width:40px;height:32px;border:none;background:none;cursor:pointer;font-size:13px}
.dlg-h .hb button:hover{background:#E81123;color:#fff}
.dlg-h .hb button.q:hover{background:#E5E5E5;color:#000}
.dlg-b{padding:10px 12px;overflow:auto;flex:1}
.dlg-f{display:flex;justify-content:flex-end;gap:7px;padding:8px 12px 12px;flex:none;align-items:center}
.dlg-f .left{margin-right:auto}
.wbtn{min-width:76px;height:24px;border:1px solid #ADADAD;background:var(--dlg-btn);font-size:12px;cursor:pointer;padding:0 10px;font-family:inherit;color:#000}
.wbtn:hover{background:#E5F1FB;border-color:#0078D7}
.wbtn.def{border:1px solid #0078D7;box-shadow:inset 0 0 0 1px #0078D7}
.wbtn[disabled]{color:#999;cursor:default;background:#F4F4F4;border-color:#CCC}
.w-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.w-row>label:first-child{min-width:110px}
.w-in{height:22px;border:1px solid #7A7A7A;font-size:12px;padding:0 4px;background:#fff;font-family:inherit;min-width:0}
.w-in:focus{outline:none;border-color:#0078D7}
textarea.w-in{height:auto;padding:4px;resize:vertical}
.w-sel{height:22px;border:1px solid #7A7A7A;font-size:12px;background:#fff;font-family:inherit;min-width:0}
.w-chk{display:flex;align-items:center;gap:6px;margin:5px 0;cursor:default}
.w-chk input,.w-rad input{margin:0}
.w-rad{display:flex;align-items:center;gap:6px;margin:4px 0}
.w-group{border:1px solid #DCDCDC;padding:8px 10px 6px;margin:10px 0 6px;position:relative}
.w-group>.gl{position:absolute;top:-8px;left:8px;background:var(--dlg-bg);padding:0 4px;color:#000}
.w-list{border:1px solid #7A7A7A;background:#fff;overflow:auto}
.w-list .it{padding:2px 6px;cursor:default;white-space:nowrap;display:flex;gap:8px;align-items:center}
.w-list .it.on{background:#0078D7;color:#fff}
.w-tabs{display:flex;gap:0;border-bottom:1px solid #ADADAD;margin-bottom:10px}
.w-tab{border:1px solid transparent;border-bottom:none;padding:4px 10px;cursor:pointer;background:none;font-size:12px;margin-bottom:-1px;font-family:inherit}
.w-tab.on{background:#fff;border-color:#ADADAD;border-bottom:1px solid #fff}
.w-panel{background:#fff;border:1px solid #ADADAD;border-top:none;padding:10px;margin-top:-10px}
.refedit{display:flex;align-items:center;flex:1;min-width:0}
.refedit .w-in{flex:1}
.refedit .rbtn{width:22px;height:22px;border:1px solid #7A7A7A;border-left:none;background:#fff;display:grid;place-items:center;font-size:10px;color:#217346}
.preview{border:1px solid #ADADAD;background:#fff;min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px}
.icon-pick{display:flex;gap:2px;align-items:center;border:1px solid #7A7A7A;background:#fff;height:22px;padding:0 4px;cursor:pointer;min-width:62px}
.vbe{position:fixed;inset:0;z-index:260;background:#F0F0F0;display:flex;flex-direction:column;font-family:var(--f-ui);font-size:12px}
.vbe-title{height:30px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 0 0 10px;border-bottom:1px solid #D4D4D4}
.vbe-title .x{margin-left:auto;width:44px;height:30px;border:none;background:none;cursor:pointer;font-size:14px}
.vbe-title .x:hover{background:#E81123;color:#fff}
.vbe-menu{display:flex;gap:2px;padding:2px 6px;border-bottom:1px solid #D4D4D4;background:#F7F7F7}
.vbe-menu span{padding:3px 7px}
.vbe-body{flex:1;display:flex;min-height:0}
.vbe-tree{width:240px;border-right:1px solid #ADADAD;background:#fff;overflow:auto;padding:6px;font-size:12px}
.vbe-tree div{padding:2px 4px;white-space:nowrap;cursor:default}
.vbe-tree div.on{background:#0078D7;color:#fff}
.vbe-code{flex:1;display:flex;flex-direction:column;min-width:0}
.vbe-code .bar{display:flex;gap:6px;padding:4px;background:#F0F0F0;border-bottom:1px solid #D4D4D4}
.vbe-code .bar select{font-size:12px;height:22px}
.vbe-code textarea{flex:1;border:none;font-family:var(--f-mono);font-size:13px;padding:8px 10px;resize:none;outline:none;color:#000;line-height:1.5;white-space:pre;tab-size:4;user-select:text;-webkit-user-select:text}
.backstage{position:fixed;inset:0;z-index:240;display:flex;background:#fff;font-family:var(--f-ui);color:var(--xl-text)}
.bs-nav{width:220px;background:var(--xl-green);color:#fff;display:flex;flex-direction:column;padding:8px 0;flex:none;overflow:auto}
.bs-nav .back{border:none;background:none;color:#fff;width:44px;height:44px;margin:0 0 8px 8px;cursor:pointer;border-radius:50%;display:grid;place-items:center}
.bs-nav .back:hover{background:rgba(255,255,255,.15)}
.bs-nav .it{padding:10px 22px;cursor:pointer;font-size:13.5px;display:flex;gap:10px;align-items:center}
.bs-nav .it:hover{background:var(--xl-green-d)}
.bs-nav .it.on{background:var(--xl-green-d);font-weight:600}
.bs-nav .sep{height:1px;background:rgba(255,255,255,.25);margin:8px 18px}
.bs-nav .bottom{margin-top:auto}
.bs-main{flex:1;overflow:auto;padding:28px 40px;min-width:0}
.bs-main h1{font-weight:300;font-size:30px;margin:0 0 20px;color:#333}
.bs-tile{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid transparent;max-width:640px;cursor:pointer}
.bs-tile:hover{background:#F3F2F1;border-color:#E1DFDD}
.bs-tile .big{width:76px;height:76px;border:1px solid #C8C6C4;display:grid;place-items:center;flex:none;background:#fff;text-align:center;font-size:11px;gap:2px;padding:4px}
.bs-tile .big svg{width:30px;height:30px}
.bs-tile h3{margin:0 0 4px;font-size:15px;font-weight:600}
.bs-tile p{margin:0;font-size:12.5px;color:#555;max-width:440px;line-height:1.45}
.opt-dlg .dlg-b{padding:0;display:flex;min-height:480px}
.opt-nav{width:200px;border-right:1px solid #D4D4D4;background:#fff;padding:6px 0;flex:none;overflow:auto}
.opt-nav div{padding:5px 12px;cursor:default}
.opt-nav div:hover{background:#E5F1FB}
.opt-nav div.on{background:#CCE8FF}
.opt-body{flex:1;background:#fff;padding:14px 18px;overflow:auto;min-width:0}
.opt-body h4{font-size:12px;margin:14px 0 8px;font-weight:700;border-bottom:1px solid #E1E1E1;padding-bottom:4px}
.opt-body h4:first-child{margin-top:0}
.opt-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13px}
.opt-head svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:calc(36% + 14px);transform:translateX(-50%);background:#323130;color:#fff;font-size:12.5px;padding:8px 14px;border-radius:4px;z-index:400;max-width:min(560px,90vw);text-align:center;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.xlalert .dlg-b{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 6px;max-width:460px;line-height:1.45}
.xlalert .ai{width:34px;height:34px;flex:none}

/* ================= panneau des tâches (style centre d'examen) ================= */
.splitter{height:7px;background:var(--cn-night);cursor:row-resize;flex:none;position:relative}
.splitter::after{content:"";position:absolute;left:50%;top:2px;width:44px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);transform:translateX(-50%)}
.tp{height:34%;min-height:44px;flex:none;display:flex;flex-direction:column;background:#fff;font-family:var(--f-ui);color:var(--cn-text);border-top:1px solid var(--cn-night)}
.tp-h{display:flex;align-items:center;gap:12px;background:var(--cn-night);color:#fff;padding:6px 12px;flex:none;flex-wrap:wrap;min-height:44px}
.tp-h .cn-logo{font-size:13px}
.tp-h .cn-logo svg{width:22px;height:22px}
.tp-proj{flex:1;min-width:180px;font-size:13.5px;display:flex;flex-direction:column;line-height:1.25}
.tp-proj small{color:#A9B9CF;font-size:11.5px}
.timer{font-family:var(--f-mono);font-size:15px;background:var(--cn-ink);border:1px solid var(--cn-night-3);border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.timer .d{width:8px;height:8px;border-radius:50%;background:#58C98B}
.timer.low{border-color:var(--cn-star);color:var(--cn-star)}
.timer.low .d{background:var(--cn-star)}
.timer.crit{background:#5C1810;border-color:#E2573F;color:#FFD3CB}
.tp-btn{font:inherit;font-size:12.5px;font-weight:600;border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;white-space:nowrap}
.tp-btn:hover{background:rgba(255,255,255,.1)}
.tp-btn.star{background:var(--cn-star);color:#2A1C00;border-color:var(--cn-star)}
.tp-btn.star:hover{background:#FFC555}
.tp-btn.icon{padding:6px 9px}
.tp-tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--cn-line);background:var(--cn-paper);flex:none;overflow-x:auto}
.tp-tab{border:1px solid var(--cn-line);border-bottom:none;background:#EAEFF5;border-radius:8px 8px 0 0;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--cn-text);white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500}
.tp-tab:hover{background:#fff}
.tp-tab.on{background:#fff;font-weight:700;color:var(--cn-night);box-shadow:inset 0 3px 0 var(--cn-star);margin-bottom:-1px;padding-bottom:7px}
.tp-tab .st{font-size:11px}
.tp-tab .st.done{color:var(--cn-ok)} .tp-tab .st.flag{color:var(--cn-warn)}
.tp-body{flex:1;overflow:auto;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
@media (max-width:820px){.tp-body{grid-template-columns:1fr}}
.tp-text{font-size:calc(15px * var(--tp-scale,1));line-height:1.6;max-width:95ch}
.tp-text b{color:var(--cn-night)}
.tp-train{display:flex;flex-direction:column;gap:6px;min-width:190px}
.tp-train .tbtn{font:inherit;font-size:12.5px;border:1px solid var(--cn-line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tp-train .tbtn:hover{border-color:var(--cn-night-3)}
.tp-train .tbtn.primary{background:var(--cn-night-2);color:#fff;border-color:var(--cn-night-2)}
.fb{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.fb.ok{background:#E3F3EA;color:#145A37;border:1px solid #9FD3B5}
.fb.ko{background:#FBE9E6;color:#7E2219;border:1px solid #EDB4AA}
.fb.hint{background:#FFF6DE;color:#5E4300;border:1px solid #EBCF84}
.fb ol{margin:6px 0 0;padding-left:20px}
.tp-f{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--cn-line);flex:none;flex-wrap:wrap;background:var(--cn-paper)}
.tp-f .grow{flex:1}
.tp-act{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--cn-line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--cn-text);white-space:nowrap}
.tp-act:hover{border-color:var(--cn-night-3)}
.tp-act.on-done{background:#E3F3EA;border-color:#8CC9A6;color:#145A37}
.tp-act.on-flag{background:#FFF1D6;border-color:#E3B95C;color:#6B4700}
.tp-act.nav{background:var(--cn-night-2);color:#fff;border-color:var(--cn-night-2)}
.tp-act.nav:hover{background:var(--cn-night-3)}
.tp-act[disabled]{opacity:.45;cursor:default}
.tp.collapsed .tp-tabs,.tp.collapsed .tp-body,.tp.collapsed .tp-f{display:none}
.tp.collapsed{height:auto!important}
.cn-modal-back{position:fixed;inset:0;z-index:500;background:rgba(10,20,35,.55);display:grid;place-items:center;padding:16px}
.cn-modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
.cn-modal h3{font-family:var(--f-display);margin:0 0 8px;font-size:19px}
.cn-modal p{color:var(--cn-muted);line-height:1.55;margin:0 0 12px;font-size:14px}
.cn-modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.cn-modal textarea{width:100%;min-height:100px;font:inherit;padding:10px;border:1px solid var(--cn-line);border-radius:8px}

/* ================= sommaire & résultats ================= */
.rev{max-width:1020px;margin:0 auto;padding:28px 0 60px}
.rev h1{font-family:var(--f-display);font-size:24px;margin:4px 0 6px}
.rev-proj{background:#fff;border:1px solid var(--cn-line);border-radius:12px;margin-top:14px;overflow:hidden}
.rev-proj .hd{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--cn-mist);flex-wrap:wrap}
.rev-proj .hd h4{margin:0;font-size:14.5px;flex:1}
.rev-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-top:1px solid var(--cn-line);align-items:center;font-size:13.5px;cursor:pointer}
.rev-row:hover{background:#F7F9FC}
.rev-row .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cn-muted)}
.rev-row .badges{display:flex;gap:6px}
@media (max-width:640px){.rev-row{grid-template-columns:70px minmax(0,1fr)}.rev-row .badges{grid-column:2}}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;border-radius:16px;padding:26px 28px;color:#fff;background:linear-gradient(120deg,var(--cn-night-2),var(--cn-ink))}
@media (max-width:640px){.score{grid-template-columns:1fr}}
.gauge{width:170px;height:170px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display)}
.gauge .v b{font-size:38px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.gauge .v small{font-size:12px;color:#A9B9CF}
.verdict{font-family:var(--f-display);font-size:26px;margin:0 0 6px}
.verdict.pass{color:#7FE0AA} .verdict.fail{color:#FF9C8A}
.score p{margin:4px 0;color:#C9D5E6;font-size:14px}
.dom-list{background:#fff;border:1px solid var(--cn-line);border-radius:12px;padding:16px 18px;margin-top:16px}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) 180px 52px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
@media (max-width:640px){.dom-row{grid-template-columns:1fr 90px 44px}}
.bar{height:9px;background:var(--cn-mist);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cn-night-3);border-radius:5px}
.bar.ok i{background:var(--cn-ok)} .bar.ko i{background:var(--cn-bad)}
.dom-row .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.res-task{border-top:1px solid var(--cn-line);padding:12px 16px;font-size:13.5px;line-height:1.5}
.res-task .top{display:flex;gap:10px;align-items:flex-start}
.res-task .top .n{font-weight:700;white-space:nowrap}
.res-task details{margin-top:6px}
.res-task summary{cursor:pointer;color:var(--cn-night-3);font-weight:600;font-size:13px}
.res-task ol{margin:6px 0 0;padding-left:20px;color:var(--cn-text)}
.code-box{font-family:var(--f-mono);font-size:12px;background:var(--cn-mist);border-radius:8px;padding:10px;word-break:break-all;max-height:120px;overflow:auto;user-select:all}

/* Charte CERTINOVA (logo officiel) */
.brand-logo{display:block;height:auto;max-width:100%}
.brand-plate{background:#fff;border-radius:12px;padding:6px 14px;display:inline-flex;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.brand-plate.sm{padding:3px 8px;border-radius:7px;box-shadow:none}
.brand-plate.sm .brand-logo{height:28px;width:auto}
.cn-hero{background:radial-gradient(1100px 420px at 85% -10%,rgba(0,148,218,.45) 0%,transparent 60%),linear-gradient(180deg,#104FA2 0%,#071D40 100%)}
.cn-eyebrow{color:#7FD3F7}
.btn-star{background:var(--cn-star-d);color:#fff}
.btn-star:hover{background:#006BA6}
.tp-btn.star{background:var(--cn-star-d);border-color:var(--cn-star-d);color:#fff}
.tp-btn.star:hover{background:#006BA6}
.timer.low{border-color:#F4B740;color:#F4B740}
.timer.low .d{background:#F4B740}
.rev .brand-logo,.brief .brand-logo{margin-bottom:6px}
</style>

/* ============================================================
   CERTINOVA — Moteur de formules (syntaxe Excel française)
   Références A1, plages, références entre feuilles, noms définis,
   références structurées de tableaux, tableaux dynamiques (propagation),
   environ 110 fonctions, formats de nombre français.
   ============================================================ */
'use strict';

/* ---------- références ---------- */
function colToIndex(s){ let n=0; s=s.toUpperCase(); for(const ch of s) n=n*26+(ch.charCodeAt(0)-64); return n; }
function indexToCol(n){ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function A1(r,c){ return indexToCol(c)+r; }
function parseA1(ref){ const m=/^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(String(ref).trim()); return m?{c:colToIndex(m[1]),r:+m[2]}:null; }
function parseRangeStr(s){
  s=String(s).trim().replace(/\$/g,"");
  const parts=s.split(":");
  const a=parseA1(parts[0]); if(!a) return null;
  const b=parts[1]?parseA1(parts[1]):a; if(!b) return null;
  return {r1:Math.min(a.r,b.r),c1:Math.min(a.c,b.c),r2:Math.max(a.r,b.r),c2:Math.max(a.c,b.c)};
}
function rangeToStr(g, abs){
  const d=abs?"$":"";
  const a=d+indexToCol(g.c1)+d+g.r1, b=d+indexToCol(g.c2)+d+g.r2;
  return (g.r1===g.r2&&g.c1===g.c2)?a:a+":"+b;
}
/* "'Feuille'!$A$1:$B$3" ou "Feuille!A1" → {sheet, r1..} */
function parseFullRef(s, defSheet){
  s=String(s).trim().replace(/^=/,"");
  let sheet=defSheet, rest=s;
  const m=/^(?:'((?:[^']|'')+)'|([^!'"]+))!(.+)$/.exec(s);
  if(m){ sheet=(m[1]!=null?m[1].replace(/''/g,"'"):m[2]); rest=m[3]; }
  const g=parseRangeStr(rest); if(!g) return null;
  return Object.assign({sheet},g);
}
function quoteSheet(n){ return /^[A-Za-z_][A-Za-z0-9_]*$/.test(n)?n:"'"+n.replace(/'/g,"''")+"'"; }
function fullRefStr(sheet,g,abs){ return quoteSheet(sheet)+"!"+rangeToStr(g,abs); }

/* ---------- erreurs ---------- */
class XErr{ constructor(c){ this.code=c; } toString(){ return this.code; } }
const ERR={ NA:new XErr("#N/A"), DIV0:new XErr("#DIV/0!"), VALUE:new XErr("#VALEUR!"), REF:new XErr("#REF!"),
  NAME:new XErr("#NOM?"), NUM:new XErr("#NOMBRE!"), SPILL:new XErr("#PROPAGATION!"), CALC:new XErr("#CALC!"), NULL:new XErr("#NUL!") };
const isErr=v=>v instanceof XErr;
const isRef=v=>v&&typeof v==="object"&&v.kind==="ref";
const isArr=Array.isArray;

const MONTHS_FR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_ABBR=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

const EXCEL_EPOCH=Date.UTC(1899,11,30);
function dateSerial(y,m,d){ return Math.round((Date.UTC(y,m-1,d)-EXCEL_EPOCH)/86400000); }
function serialToDate(s){ return new Date(EXCEL_EPOCH+Math.floor(s)*86400000); }
function todaySerial(){ const n=new Date(); return dateSerial(n.getFullYear(),n.getMonth()+1,n.getDate()); }

/* ---------- tokeniseur ---------- */
const ID_START=/[A-Za-z_\\À-ÖØ-öø-ÿ]/;
const ID_CHAR=/[A-Za-z0-9_.\\À-ÖØ-öø-ÿ]/;
function tokenize(src){
  const T=[]; let i=0; const n=src.length;
  const refRe=/^(\$?[A-Za-z]{1,3}\$?\d+)(?::(\$?[A-Za-z]{1,3}\$?\d+))?(#)?/;
  const colRe=/^(\$?[A-Za-z]{1,3}):(\$?[A-Za-z]{1,3})(?![A-Za-z0-9_(])/;
  function readRefAt(sheet){
    const rest=src.slice(i);
    let m=refRe.exec(rest);
    if(m && !/[A-Za-z0-9_(]/.test(rest.charAt(m[0].length)) ){
      i+=m[0].length;
      const a=parseA1(m[1]), b=m[2]?parseA1(m[2]):a;
      T.push({t:"ref",sheet,r1:Math.min(a.r,b.r),c1:Math.min(a.c,b.c),r2:Math.max(a.r,b.r),c2:Math.max(a.c,b.c),spill:!!m[3],txt:m[0]});
      return true;
    }
    m=colRe.exec(rest);
    if(m){ i+=m[0].length; const c1=colToIndex(m[1].replace("$","")), c2=colToIndex(m[2].replace("$",""));
      T.push({t:"ref",sheet,r1:1,c1:Math.min(c1,c2),r2:1048576,c2:Math.max(c1,c2),whole:true,txt:m[0]}); return true; }
    return false;
  }
  function readBracket(){ // lit [ ... ] avec imbrication
    let depth=0, s="";
    while(i<n){ const ch=src[i]; s+=ch; i++; if(ch==="[") depth++; else if(ch==="]"){ depth--; if(depth===0) break; } }
    return s;
  }
  while(i<n){
    const ch=src[i];
    if(ch===" "||ch==="\n"||ch==="\t"||ch==="\u00a0"){ i++; continue; }
    if(ch==='"'){ let s=""; i++; while(i<n){ if(src[i]==='"'){ if(src[i+1]==='"'){ s+='"'; i+=2; continue; } i++; break; } s+=src[i++]; } T.push({t:"str",v:s}); continue; }
    if(ch==="'"){ let s=""; i++; while(i<n){ if(src[i]==="'"){ if(src[i+1]==="'"){ s+="'"; i+=2; continue; } i++; break; } s+=src[i++]; }
      if(src[i]==="!"){ i++; if(!readRefAt(s)) throw new Error("ref"); continue; } throw new Error("quote"); }
    if(ch==="#"&&/^#(N\/A|DIV\/0!|VALEUR!|REF!|NOM\?|NOMBRE!|VALUE!|NAME\?)/i.test(src.slice(i))){
      const m=/^#(N\/A|DIV\/0!|VALEUR!|REF!|NOM\?|NOMBRE!|VALUE!|NAME\?)/i.exec(src.slice(i)); i+=m[0].length; T.push({t:"err",v:m[0].toUpperCase()}); continue; }
    if(ch==="["){ const b=readBracket(); T.push({t:"struct",table:null,spec:b}); continue; }
    if(/[0-9]/.test(ch)||(ch==="."&&/[0-9]/.test(src[i+1]||""))){
      if(readRefAt(null)) continue;
      const m=/^(\d*(?:[.,]\d+)?|\d+)(?:[Ee][+-]?\d+)?/.exec(src.slice(i));
      let s=m[0]; i+=s.length; T.push({t:"num",v:Number(s.replace(",","."))}); continue;
    }
    if(ch==="$"){ if(readRefAt(null)) continue; i++; continue; }
    if(ID_START.test(ch)){
      // référence de cellule ?
      if(/[A-Za-z]/.test(ch) && readRefAt(null)) continue;
      let s=""; while(i<n && ID_CHAR.test(src[i])) s+=src[i++];
      if(src[i]==="!"){ i++; if(!readRefAt(s)) throw new Error("ref"); continue; }
      if(src[i]==="["){ const b=readBracket(); T.push({t:"struct",table:s,spec:b}); continue; }
      T.push({t:"id",v:s}); continue;
    }
    const two=src.substr(i,2);
    if(two==="<="||two===">="||two==="<>"){ T.push({t:"op",v:two}); i+=2; continue; }
    if("+-*/^&=<>%(),;{}".includes(ch)){ T.push({t:"op",v:ch}); i++; continue; }
    throw new Error("char "+ch);
  }
  return T;
}

/* ---------- analyseur (AST) ---------- */
function parseFormula(text){
  let src=String(text).trim(); if(src.startsWith("=")) src=src.slice(1);
  const T=tokenize(src); let p=0;
  const peek=()=>T[p], nxt=()=>T[p++];
  const isOp=(v)=>T[p]&&T[p].t==="op"&&T[p].v===v;
  function expr(){ return cmp(); }
  function cmp(){ let a=cat(); while(T[p]&&T[p].t==="op"&&["=","<>","<",">","<=",">="].includes(T[p].v)){ const op=nxt().v; a={t:"bin",op,a,b:cat()}; } return a; }
  function cat(){ let a=add(); while(isOp("&")){ nxt(); a={t:"bin",op:"&",a,b:add()}; } return a; }
  function add(){ let a=mul(); while(isOp("+")||isOp("-")){ const op=nxt().v; a={t:"bin",op,a,b:mul()}; } return a; }
  function mul(){ let a=pow(); while(isOp("*")||isOp("/")){ const op=nxt().v; a={t:"bin",op,a,b:pow()}; } return a; }
  function pow(){ let a=un(); while(isOp("^")){ nxt(); a={t:"bin",op:"^",a,b:un()}; } return a; }
  function un(){ if(isOp("-")){ nxt(); return {t:"un",op:"-",a:un()}; } if(isOp("+")){ nxt(); return un(); } return post(); }
  function post(){ let a=prim(); while(isOp("%")){ nxt(); a={t:"pct",a}; } return a; }
  function prim(){
    const k=nxt(); if(!k) throw new Error("fin");
    if(k.t==="num") return {t:"num",v:k.v};
    if(k.t==="str") return {t:"str",v:k.v};
    if(k.t==="err") return {t:"errv",v:k.v};
    if(k.t==="ref") return Object.assign({},k,{t:"ref"});
    if(k.t==="struct") return {t:"struct",table:k.table,spec:k.spec};
    if(k.t==="op"&&k.v==="("){ const e=expr(); if(isOp(")")) nxt(); return e; }
    if(k.t==="op"&&k.v==="{"){ // constante matricielle
      const rows=[[]];
      while(p<T.length && !isOp("}")){
        if(isOp(";")){ nxt(); rows.push([]); continue; }
        if(isOp(",")||isOp("\\")){ nxt(); continue; }
        let neg=false; if(isOp("-")){ nxt(); neg=true; }
        const v=nxt(); rows[rows.length-1].push(v.t==="num"?(neg?-v.v:v.v):(v.t==="str"?v.v:(v.t==="id"?/^(VRAI|TRUE)$/i.test(v.v):null)));
      }
      nxt(); return {t:"arr",rows};
    }
    if(k.t==="id"){
      const up=k.v.toUpperCase();
      if(isOp("(")){
        nxt(); const args=[];
        if(!isOp(")")){
          while(true){
            if(isOp(";")||isOp(",")){ args.push({t:"miss"}); nxt(); continue; }
            if(isOp(")")) break;
            args.push(expr());
            if(isOp(";")||isOp(",")){ nxt(); if(isOp(")")){ args.push({t:"miss"}); } continue; }
            break;
          }
        }
        if(isOp(")")) nxt(); else throw new Error("parenthèse");
        return {t:"fn",name:up.replace(/^_XLFN\./,""),args};
      }
      if(up==="VRAI"||up==="TRUE") return {t:"bool",v:true};
      if(up==="FAUX"||up==="FALSE") return {t:"bool",v:false};
      return {t:"name",v:k.v};
    }
    throw new Error("jeton");
  }
  const ast=expr();
  if(p<T.length) throw new Error("reste");
  return ast;
}

/* ---------- évaluation ---------- */
function deref(ctx,v){
  if(isRef(v)){
    if(v.r1===v.r2&&v.c1===v.c2) return ctx.wb.getValue(v.sheet,v.r1,v.c1);
    const b=ctx.wb.usedBounds(v.sheet);
    const r2=Math.min(v.r2,Math.max(b.r2,v.r1)), c2=Math.min(v.c2,Math.max(b.c2,v.c1));
    const out=[];
    for(let r=v.r1;r<=r2;r++){ const row=[]; for(let c=v.c1;c<=c2;c++) row.push(ctx.wb.getValue(v.sheet,r,c)); out.push(row); }
    return out;
  }
  return v;
}
function scalar(ctx,v){
  v=deref(ctx,v);
  if(isArr(v)) return v.length&&v[0].length? v[0][0] : null;
  return v;
}
function toArr(ctx,v){ v=deref(ctx,v); return isArr(v)?v:[[v]]; }
function flatVals(ctx,v){ const a=toArr(ctx,v); const o=[]; a.forEach(r=>r.forEach(x=>o.push(x))); return o; }
function num(v){
  if(isErr(v)) throw v;
  if(v==null||v==="") return 0;
  if(typeof v==="boolean") return v?1:0;
  if(typeof v==="number") return v;
  const s=String(v).trim().replace(/\u00a0|\s/g,"").replace(",",".");
  if(/^-?\d*\.?\d+(e[+-]?\d+)?%?$/i.test(s)){ return s.endsWith("%")?Number(s.slice(0,-1))/100:Number(s); }
  const d=parseDateText(String(v)); if(d!=null) return d;
  throw ERR.VALUE;
}
function txt(v){ if(isErr(v)) throw v; if(v==null) return ""; if(typeof v==="boolean") return v?"VRAI":"FAUX"; if(typeof v==="number") return fmtGeneral(v); return String(v); }
function truthy(v){ if(isErr(v)) throw v; if(typeof v==="string"){ const u=v.toUpperCase(); if(u==="VRAI"||u==="TRUE") return true; if(u==="FAUX"||u==="FALSE") return false; throw ERR.VALUE; } return !!v; }
function parseDateText(s){
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s.trim()); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return dateSerial(y,+m[2],+m[1]);
}

/* diffusion élément par élément */
function broadcast(a,b,fn){
  const A=isArr(a), B=isArr(b);
  if(!A&&!B) return fn(a,b);
  const ra=A?a.length:1, ca=A?a[0].length:1, rb=B?b.length:1, cb=B?b[0].length:1;
  const R=Math.max(ra,rb), C=Math.max(ca,cb); const out=[];
  for(let r=0;r<R;r++){ const row=[]; for(let c=0;c<C;c++){
    const x=A?((a[ra===1?0:r]||[])[ca===1?0:c]):a, y=B?((b[rb===1?0:r]||[])[cb===1?0:c]):b;
    row.push((x===undefined||y===undefined)?ERR.NA:fn(x,y)); } out.push(row); }
  return out;
}
function safe(fn){ return (...a)=>{ try{ return fn(...a); }catch(e){ if(isErr(e)) return e; throw e; } }; }
function cmpVals(x,y){
  if(x==null) x=(typeof y==="string")?"":0; if(y==null) y=(typeof x==="string")?"":0;
  const rank=v=>typeof v==="number"?0:typeof v==="string"?1:2;
  if(rank(x)!==rank(y)) return rank(x)-rank(y);
  if(typeof x==="string") return x.localeCompare(y,"fr",{sensitivity:"base"});
  return x<y?-1:x>y?1:0;
}
const BIN={
  "+":safe((x,y)=>num(x)+num(y)), "-":safe((x,y)=>num(x)-num(y)), "*":safe((x,y)=>num(x)*num(y)),
  "/":safe((x,y)=>{ const d=num(y); if(d===0) throw ERR.DIV0; return num(x)/d; }),
  "^":safe((x,y)=>Math.pow(num(x),num(y))), "&":safe((x,y)=>txt(x)+txt(y)),
  "=":safe((x,y)=>{ if(isErr(x)) throw x; if(isErr(y)) throw y; return cmpVals(x,y)===0; }),
  "<>":safe((x,y)=>{ if(isErr(x)) throw x; if(isErr(y)) throw y; return cmpVals(x,y)!==0; }),
  "<":safe((x,y)=>{ if(isErr(x)) throw x; if(isErr(y)) throw y; return cmpVals(x,y)<0; }),
  ">":safe((x,y)=>{ if(isErr(x)) throw x; if(isErr(y)) throw y; return cmpVals(x,y)>0; }),
  "<=":safe((x,y)=>{ if(isErr(x)) throw x; if(isErr(y)) throw y; return cmpVals(x,y)<=0; }),
  ">=":safe((x,y)=>{ if(isErr(x)) throw x; if(isErr(y)) throw y; return cmpVals(x,y)>=0; }),
};

function evalNode(ctx,n){
  switch(n.t){
    case "num": case "str": case "bool": return n.v;
    case "errv": return new XErr(n.v.replace("#VALUE!","#VALEUR!").replace("#NAME?","#NOM?"));
    case "miss": return null;
    case "arr": return n.rows;
    case "ref":{
      const sheet=n.sheet||ctx.sheet;
      if(!ctx.wb.hasSheet(sheet)) return ERR.REF;
      if(n.spill){ const s=ctx.wb.spillRef(sheet,n.r1,n.c1); return s||ERR.REF; }
      return {kind:"ref",sheet,r1:n.r1,c1:n.c1,r2:n.r2,c2:n.c2};
    }
    case "struct":{ const r=ctx.wb.resolveStruct(n.table,n.spec,ctx); return r||ERR.REF; }
    case "name":{
      if(ctx.lets && n.v.toUpperCase() in ctx.lets) return ctx.lets[n.v.toUpperCase()];
      const r=ctx.wb.resolveName(n.v,ctx.sheet); if(r==null) return ERR.NAME;
      return r;
    }
    case "un": { const v=deref(ctx,evalNode(ctx,n.a)); return broadcast(v,0,safe(x=>-num(x))); }
    case "pct": { const v=deref(ctx,evalNode(ctx,n.a)); return broadcast(v,0,safe(x=>num(x)/100)); }
    case "bin":{
      const a=deref(ctx,evalNode(ctx,n.a)), b=deref(ctx,evalNode(ctx,n.b));
      return broadcast(a,b,BIN[n.op]);
    }
    case "fn": return callFn(ctx,n);
  }
  return ERR.VALUE;
}

/* ---------- critères NB.SI / SOMME.SI ---------- */
function makeCrit(crit){
  if(isErr(crit)) throw crit;
  if(typeof crit==="number"||typeof crit==="boolean") return v=>cmpVals(v==null?"":v,crit)===0 && v!=null && v!=="";
  let s=crit==null?"":String(crit);
  const m=/^(<=|>=|<>|<|>|=)?(.*)$/s.exec(s); const op=m[1]||"="; let rhs=m[2];
  let rn=rhs.trim()===""?NaN:Number(rhs.replace(",","."));
  if(isNaN(rn)){ const d=parseDateText(rhs); if(d!=null) rn=d; }
  if(!isNaN(rn)){
    return v=>{ if(typeof v!=="number") return op==="<>"; switch(op){case "=":return v===rn;case "<>":return v!==rn;case "<":return v<rn;case ">":return v>rn;case "<=":return v<=rn;case ">=":return v>=rn;} };
  }
  const low=rhs.toLowerCase();
  if(op==="="||op==="<>"){
    if(rhs===""){ return op==="="? (v=>v==null||v===""):(v=>!(v==null||v==="")); }
    const re=new RegExp("^"+low.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/~\*/g,"\u0001").replace(/~\?/g,"\u0002").replace(/\*/g,".*").replace(/\?/g,".").replace(/\u0001/g,"\\*").replace(/\u0002/g,"\\?")+"$","s");
    return op==="="? (v=>re.test(txt(v==null?"":v).toLowerCase())) : (v=>!re.test(txt(v==null?"":v).toLowerCase()));
  }
  return v=>{ if(typeof v!=="string") return false; const c=v.localeCompare(rhs,"fr",{sensitivity:"base"}); switch(op){case "<":return c<0;case ">":return c>0;case "<=":return c<=0;case ">=":return c>=0;} };
}

/* ---------- utilitaires fonctions ---------- */
function nums(ctx,args,{countText=false}={}){
  const o=[];
  args.forEach(a=>{
    if(isRef(a)||isArr(a)){ flatVals(ctx,a).forEach(x=>{ if(isErr(x)) throw x; if(typeof x==="number") o.push(x); }); }
    else { const v=a; if(v==null) return; if(isErr(v)) throw v; o.push(num(v)); }
  });
  return o;
}
function arrDims(a){ return [a.length, a[0]?a[0].length:0]; }
function lookupMatch(vec,val,mode){ // mode 0 exact, 1 inférieur le plus proche (trié), -1 supérieur
  if(mode===0){
    const crit=typeof val==="string"&&/[*?]/.test(val)?makeCrit(val):null;
    for(let i=0;i<vec.length;i++){ if(crit?crit(vec[i]):cmpVals(vec[i],val)===0 && vec[i]!=null) return i; }
    return -1;
  }
  let best=-1;
  for(let i=0;i<vec.length;i++){ if(vec[i]==null||vec[i]==="") continue; const c=cmpVals(vec[i],val); if(c<=0 && (typeof vec[i]===typeof val)) best=i; else if(c>0) break; }
  return best;
}
function xlookupIdx(vec,val,mode){ // RECHERCHEX : 0 exact, -1 exact ou inférieur, 1 exact ou supérieur, 2 caractères génériques
  let bi=-1;
  for(let i=0;i<vec.length;i++){
    const v=vec[i];
    if(mode===2){ if(makeCrit(val)(v)) return i; continue; }
    if(v!=null && cmpVals(v,val)===0 && typeof v===typeof val) return i;
    if(mode===-1 && typeof v===typeof val && cmpVals(v,val)<0 && (bi<0||cmpVals(v,vec[bi])>0)) bi=i;
    if(mode===1 && typeof v===typeof val && cmpVals(v,val)>0 && (bi<0||cmpVals(v,vec[bi])<0)) bi=i;
  }
  return bi;
}
function textFormat(v,fmt){ return formatValue(v,fmt).text; }

/* alias anglais → nom français canonique */
const FN_ALIAS={SUBTOTAL:"SOUS.TOTAL",SUM:"SOMME",AVERAGE:"MOYENNE",COUNT:"NB",COUNTA:"NBVAL",COUNTBLANK:"NB.VIDE",COUNTIF:"NB.SI",COUNTIFS:"NB.SI.ENS",
  SUMIF:"SOMME.SI",SUMIFS:"SOMME.SI.ENS",AVERAGEIF:"MOYENNE.SI",AVERAGEIFS:"MOYENNE.SI.ENS",MAXIFS:"MAX.SI.ENS",MINIFS:"MIN.SI.ENS",
  IF:"SI",IFS:"SI.CONDITIONS",SWITCH:"SI.MULTIPLE",IFERROR:"SIERREUR",IFNA:"SI.NON.DISP",AND:"ET",OR:"OU",NOT:"NON",XOR:"OUX",
  ROUND:"ARRONDI",ROUNDUP:"ARRONDI.SUP",ROUNDDOWN:"ARRONDI.INF",INT:"ENT",POWER:"PUISSANCE",SQRT:"RACINE",RAND:"ALEA",

  DROP:"EXCLURE",CHOOSECOLS:"CHOISIRCOLS",CHOOSEROWS:"CHOISIRLIGNES",WEEKNUM:"NO.SEMAINE",HOUR:"HEURE",MINUTE:"MINUTE",SECOND:"SECONDE",
  TIME:"TEMPS",DAYS:"JOURS",LOWER_:"MINUSCULE"};
const FR_TO_EN={}; Object.keys(FN_ALIAS).forEach(k=>{ if(!FR_TO_EN[FN_ALIAS[k]]) FR_TO_EN[FN_ALIAS[k]]=k; });

function callFn(ctx,n){
  let name=n.name; if(FN_ALIAS[name]) name=FN_ALIAS[name];
  const A=n.args;
  const ev=i=>i<A.length?evalNode(ctx,A[i]):undefined;
  const sv=i=>{ const v=ev(i); return v===undefined?undefined:scalar(ctx,v); };
  const has=i=>i<A.length&&A[i].t!=="miss";
  try{
  switch(name){
    /* --- logique (paresseuse) --- */
    case "SI":{
      const c=deref(ctx,ev(0));
      if(isArr(c)){ const a=has(1)?deref(ctx,ev(1)):true, b=has(2)?deref(ctx,ev(2)):false;
        return broadcast(broadcast(c,a,(x,y)=>[x,y]),b,(xy,z)=>{ try{ return truthy(xy[0])?xy[1]:z; }catch(e){ return e; } }); }
      if(truthy(c)) return has(1)?ev(1):(A.length>1?0:true);
      return A.length>2?(has(2)?ev(2):0):false;
    }
    case "SIERREUR":{ const v=deref(ctx,ev(0)); if(isArr(v)){ const alt=deref(ctx,ev(1)); return broadcast(v,alt,(x,y)=>isErr(x)?y:x); } return isErr(v)?ev(1):v; }
    case "SI.NON.DISP":{ const v=deref(ctx,ev(0)); return (isErr(v)&&v.code==="#N/A")?ev(1):v; }
    case "SI.CONDITIONS":{ for(let i=0;i+1<A.length;i+=2){ if(truthy(sv(i))) return ev(i+1); } return ERR.NA; }
    case "SI.MULTIPLE":{ const v=sv(0); let i=1; for(;i+1<A.length;i+=2){ if(cmpVals(v,sv(i))===0) return ev(i+1); } return i<A.length?ev(i):ERR.NA; }
    case "LET":{
      const c2=Object.assign({},ctx,{lets:Object.assign({},ctx.lets||{})});
      for(let i=0;i+1<A.length;i+=2){ const nm=A[i].v||(A[i].t==="ref"?A[i].txt:""); c2.lets[String(nm).toUpperCase()]=evalNode(c2,A[i+1]); }
      return evalNode(c2,A[A.length-1]);
    }
    case "ET":{ let r=true; A.forEach((_,i)=>{ const v=ev(i); (isRef(v)||isArr(v)?flatVals(ctx,v).filter(x=>typeof x==="boolean"||typeof x==="number"):[scalar(ctx,v)]).forEach(x=>{ if(!truthy(x)) r=false; }); }); return r; }
    case "OU":{ let r=false; A.forEach((_,i)=>{ const v=ev(i); (isRef(v)||isArr(v)?flatVals(ctx,v).filter(x=>typeof x==="boolean"||typeof x==="number"):[scalar(ctx,v)]).forEach(x=>{ if(truthy(x)) r=true; }); }); return r; }
    case "OUX":{ let c=0; A.forEach((_,i)=>flatVals(ctx,ev(i)).forEach(x=>{ if(truthy(x)) c++; })); return c%2===1; }
    case "NON": { const v=deref(ctx,ev(0)); return broadcast(v,0,safe(x=>!truthy(x))); }
    case "VRAI": return true; case "FAUX": return false;
    /* --- maths --- */
    case "SOMME": return nums(ctx,A.map((_,i)=>ev(i))).reduce((a,b)=>a+b,0);
    case "SOUS.TOTAL":{ const k=Math.floor(num(sv(0)))%100; const rest=A.slice(1).map((_,i)=>ev(i+1)); const v=nums(ctx,rest);
      switch(k){ case 1: return v.length?v.reduce((a,b)=>a+b,0)/v.length:ERR.DIV0; case 2: return v.length;
        case 3: { let c=0; rest.forEach(a=>flatVals(ctx,a).forEach(x=>{ if(x!=null&&x!=="") c++; })); return c; }
        case 4: return v.length?Math.max(...v):0; case 5: return v.length?Math.min(...v):0; case 6: return v.reduce((a,b)=>a*b,1);
        default: return v.reduce((a,b)=>a+b,0); } }
    case "PRODUIT": return nums(ctx,A.map((_,i)=>ev(i))).reduce((a,b)=>a*b,1);
    case "MOYENNE":{ const v=nums(ctx,A.map((_,i)=>ev(i))); if(!v.length) return ERR.DIV0; return v.reduce((a,b)=>a+b,0)/v.length; }
    case "MAX":{ const v=nums(ctx,A.map((_,i)=>ev(i))); return v.length?Math.max(...v):0; }
    case "MIN":{ const v=nums(ctx,A.map((_,i)=>ev(i))); return v.length?Math.min(...v):0; }
    case "MEDIANE":{ const v=nums(ctx,A.map((_,i)=>ev(i))).sort((a,b)=>a-b); if(!v.length) return ERR.NUM; const m=v.length>>1; return v.length%2?v[m]:(v[m-1]+v[m])/2; }
    case "ECARTYPE": case "ECARTYPE.STANDARD":{ const v=nums(ctx,A.map((_,i)=>ev(i))); if(v.length<2) return ERR.DIV0; const mu=v.reduce((a,b)=>a+b,0)/v.length; return Math.sqrt(v.reduce((a,b)=>a+(b-mu)**2,0)/(v.length-1)); }
    case "NB": { let c=0; A.forEach((_,i)=>{ const v=ev(i); if(isRef(v)||isArr(v)) flatVals(ctx,v).forEach(x=>{ if(typeof x==="number") c++; }); else if(typeof v==="number"||(v!=null&&!isNaN(Number(v)))) c++; }); return c; }
    case "NBVAL": { let c=0; A.forEach((_,i)=>{ const v=ev(i); if(isRef(v)||isArr(v)) flatVals(ctx,v).forEach(x=>{ if(x!=null&&x!=="") c++; }); else if(v!=null) c++; }); return c; }
    case "NB.VIDE": return flatVals(ctx,ev(0)).filter(x=>x==null||x==="").length;
    case "COUNTUNIQUE": return new Set(flatVals(ctx,ev(0)).filter(x=>x!=null&&x!=="").map(x=>txt(x).toLowerCase())).size;
    case "ARRONDI": case "ARRONDI.SUP": case "ARRONDI.INF": case "TRONQUE":{
      const v=deref(ctx,ev(0)), d=has(1)?num(sv(1)):0;
      return broadcast(v,0,safe(x=>{ const f=Math.pow(10,d), y=num(x)*f; const s=Math.sign(y), a=Math.abs(y);
        const r=name==="ARRONDI"?Math.round(a+1e-9):name==="ARRONDI.SUP"?Math.ceil(a-1e-9):Math.floor(a+1e-9); return s*r/f; }));
    }
    case "ENT": return broadcast(deref(ctx,ev(0)),0,safe(x=>Math.floor(num(x))));
    case "ABS": return broadcast(deref(ctx,ev(0)),0,safe(x=>Math.abs(num(x))));
    case "SIGNE": return Math.sign(num(sv(0)));
    case "MOD":{ const a=num(sv(0)), b=num(sv(1)); if(b===0) return ERR.DIV0; return a-b*Math.floor(a/b); }
    case "PUISSANCE": return Math.pow(num(sv(0)),num(sv(1)));
    case "RACINE":{ const x=num(sv(0)); return x<0?ERR.NUM:Math.sqrt(x); }
    case "PI": return Math.PI;
    case "PLAFOND":{ const x=num(sv(0)), s=has(1)?num(sv(1)):1; return s===0?0:Math.ceil(x/s-1e-12)*s; }
    case "PLANCHER":{ const x=num(sv(0)), s=has(1)?num(sv(1)):1; return s===0?0:Math.floor(x/s+1e-12)*s; }

/* ---------- format des nombres (français) ---------- */
const NBSP="\u00a0";
function groupThousands(intStr){ return intStr.replace(/\B(?=(\d{3})+(?!\d))/g,NBSP); }
function fmtGeneral(v){
  if(typeof v!=="number") return String(v);
  if(!isFinite(v)) return "#NOMBRE!";
  if(Number.isInteger(v) && Math.abs(v)<1e11) return String(v);
  const a=Math.abs(v);
  if(a!==0&&(a>=1e11||a<1e-9)) return v.toExponential(5).replace(".",",").replace("e","E");
  let s=Number(v.toPrecision(10)).toString();
  if(/e/.test(s)) s=v.toFixed(9).replace(/0+$/,"");
  return s.replace(".",",");
}
function splitSections(code){ const out=[]; let cur="", q=false; for(const ch of code){ if(ch==='"') q=!q; if(ch===";"&&!q){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out; }
function isDateCode(code){ const s=code.replace(/"[^"]*"/g,"").replace(/\[[^\]]*\]/g,""); return /[jdmaysh]/i.test(s) && !/^[#0,.\s%€$ ]+$/.test(s); }
function formatDateCode(code,v){
  const d=serialToDate(v); const frac=v-Math.floor(v); let secs=Math.round(frac*86400);
  const H=Math.floor(secs/3600), Mi=Math.floor(secs%3600/60), S=secs%60;
  const toks=[]; let i=0; const c=code;
  while(i<c.length){
    const ch=c[i];
    if(ch==='"'){ let j=c.indexOf('"',i+1); if(j<0) j=c.length; toks.push({lit:c.slice(i+1,j)}); i=j+1; continue; }
    if(ch==="\\"){ toks.push({lit:c[i+1]||""}); i+=2; continue; }
    const m=/^(aaaa|yyyy|aa|yy|mmmmm|mmmm|mmm|mm|m|jjjj|dddd|jjj|ddd|jj|dd|j|d|hh|h|ss|s|AM\/PM)/i.exec(c.slice(i));
    if(m){ toks.push({k:m[0].toLowerCase()}); i+=m[0].length; continue; }
    toks.push({lit:ch}); i++;
  }
  // m/mm après h ou avant s = minutes
  toks.forEach((t,k)=>{ if(t.k==="m"||t.k==="mm"){ const prev=toks.slice(0,k).reverse().find(x=>x.k); const nx=toks.slice(k+1).find(x=>x.k); if((prev&&/^h/.test(prev.k))||(nx&&/^s/.test(nx.k))) t.k=t.k==="m"?"Mi":"MMi"; } });
  return toks.map(t=>{
    if(t.lit!=null) return t.lit;
    switch(t.k){
      case "aaaa": case "yyyy": return String(d.getUTCFullYear());

function formatNumberCode(code,v){
  // texte littéral
  let lits=[]; code=code.replace(/"([^"]*)"/g,(m,a)=>{ lits.push(a); return String.fromCharCode(0xE000+lits.length-1); });
  const unlit=t=>t.replace(/[-]/g,ch=>lits[ch.charCodeAt(0)-0xE000]);

  const first=code.search(/[0#?]/), lastM=code.match(/[0#?](?!.*[0#?])/);
  if(first<0){ return {neg:false,text:unlit(code)}; }
  const last=code.lastIndexOf(lastM[0]);
  let pre=code.slice(0,first), core=code.slice(first,last+1), post=code.slice(last+1);
  // séparateur décimal : "," (fr) ou "." (en)
  let decSep=null;
  if(/#,##/.test(core)){ core=core.replace(/,(?=[#0]{3})/g," "); }
  if(/[0#?]\.[0#?]/.test(core)||/[0#]\.$/.test(core)) decSep=".";

  if(decSep){ const k=core.lastIndexOf(decSep); intPart=core.slice(0,k); decPart=core.slice(k+1); }
  const grouping=/[0#] [0#]/.test(intPart)||/[0#],[0#]/.test(intPart)||/\u00a0/.test(intPart);
  const decs=(decPart.match(/[0#?]/g)||[]).length, minDec=(decPart.match(/0/g)||[]).length;
  const minInt=(intPart.match(/0/g)||[]).length;
  const neg=x<0; x=Math.abs(x);
  let s=x.toFixed(decs);
  let [ip,dp]=s.split(".");
  if(dp){ while(dp.length>minDec && dp.endsWith("0")) dp=dp.slice(0,-1); }
  if(ip==="0"&&minInt===0) ip="";
  ip=ip.padStart(minInt,"0");
  if(grouping) ip=groupThousands(ip);
  let out=ip+(dp?","+dp:(decs>0&&minDec===0&&false?",":""));
  const fix=t=>unlit(t).replace(/\\(.)/g,"$1").replace(/_./g," ").replace(/\*./g,"");
  return {neg, text:fix(pre)+out+fix(post)};
}
/* renvoie {text, align, color} */
function formatValue(v,code){
  if(v==null) return {text:"",align:null};
  if(isErr(v)) return {text:v.code,align:"center"};
  if(typeof v==="boolean") return {text:v?"VRAI":"FAUX",align:"center"};
  code=code||"Standard";
  if(typeof v==="string"){
    if(code!=="Standard"&&code!=="General"){ const secs=splitSections(code); if(secs.length===4) return {text:secs[3].replace(/@/g,v).replace(/"/g,""),align:"left"}; }
    return {text:v,align:"left"};
  }
  if(code==="Standard"||code==="General"||code==="Général") return {text:fmtGeneral(v),align:"right"};
  if(code==="@") return {text:fmtGeneral(v),align:"left"};
  const secs=splitSections(code);
  let sec=secs[0], val=v, negHandled=false;
  if(v<0&&secs.length>1){ sec=secs[1]; val=-v; negHandled=true; }
  else if(v===0&&secs.length>2){ sec=secs[2]; }
  let color=null; const cm=/\[(Rouge|Red|Bleu|Blue|Vert|Green|Noir|Black)\]/i.exec(sec);
  if(cm){ color={rouge:"#C00000",red:"#C00000",bleu:"#0070C0",blue:"#0070C0",vert:"#00B050",green:"#00B050",noir:"#000",black:"#000"}[cm[1].toLowerCase()]; }
  if(isDateCode(sec)) return {text:formatDateCode(sec.replace(/\[[^\]]*\]/g,""),val),align:"right",color};
  const r=formatNumberCode(sec,val);
  return {text:(r.neg&&!negHandled?"-":"")+r.text,align:"right",color};
}

/* conversion des formules du modèle d'origine (anglais) vers la syntaxe française */
function toFrFormula(f){
  if(!f) return f;
  let out="", q=false;
  for(let i=0;i<f.length;i++){
    const ch=f[i];
    if(ch==='"'){ q=!q; out+=ch; continue; }
    if(q){ out+=ch; continue; }
    if(ch===",") out+=";"; else if(ch==="."&&/\d/.test(f[i-1]||"")&&/\d/.test(f[i+1]||"")) out+=","; else out+=ch;

}

/* décalage des références relatives d'une formule (copie, recopie, MFC) */
function shiftFormula(f,dr,dc){
  if(!f||(!dr&&!dc)) return f;
  let out="", i=0;
  while(i<f.length){
    const ch=f[i];
    if(ch==='"'){ const j=f.indexOf('"',i+1); const k=j<0?f.length:j+1; out+=f.slice(i,k); i=k; continue; }
    if(ch==="'"){ const j=f.indexOf("'",i+1); const k=j<0?f.length:j+1; out+=f.slice(i,k); i=k; continue; }
    if(ch==="["){ let d=0,k=i; for(;k<f.length;k++){ if(f[k]==="[") d++; else if(f[k]==="]"){ d--; if(d===0) break; } } out+=f.slice(i,k+1); i=k+1; continue; }
    const m=/^(\$?)([A-Za-z]{1,3})(\$?)(\d+)/.exec(f.slice(i));
    const prev=f[i-1]||"";
    if(m && !/[A-Za-z0-9_.À-ÿ]/.test(prev) && !/[A-Za-z0-9_(À-ÿ]/.test(f[i+m[0].length]||"")){
      let c=colToIndex(m[2]), r=+m[4];
      if(!m[1]) c+=dc; if(!m[3]) r+=dr;
      out+=(c<1||r<1)?"#REF!":m[1]+indexToCol(c)+m[3]+r; i+=m[0].length; continue;
    }
    // sauter un identifiant entier (nom de fonction, nom défini)
    const w=/^[A-Za-zÀ-ÿ_][A-Za-z0-9_.À-ÿ]*/.exec(f.slice(i));
    if(w && !/[A-Za-z0-9_.À-ÿ]/.test(prev)){ out+=w[0]; i+=w[0].length; continue; }
    out+=ch; i++;
  }
  return out;
}

function normalizeFormula(f){
  f=f.trim(); if(!f.startsWith("=")) f="="+f;
  // majuscules pour les noms de fonctions et références (hors chaînes)
  let out="", q=false;

  out=out.replace(/("[^"]*")|([A-Za-zÀ-ÿ_][A-Za-z0-9_.À-ÿ]*)(?=\()/g,(m,str,fn)=>str?str:fn.toUpperCase());

  let open=0; q=false; for(const ch of out){ if(ch==='"') q=!q; if(q) continue; if(ch==="(") open++; if(ch===")") open--; }
  while(open-->0) out+=")";
  return out;
}

   TABLEAUX CROISÉS DYNAMIQUES

const AGG_LABEL={sum:"Somme",count:"Nombre",avg:"Moyenne",max:"Max",min:"Min"};
function pivotSource(wb,pv){
  let sheet, g;
  if(pv.src.table){ const t=wb.tableCI(pv.src.table); if(!t) return null; sheet=t.sheet; g=parseRangeStr(t.ref); }
  else { const r=parseFullRef(pv.src.ref, pv.src.sheet); if(!r) return null; sheet=r.sheet; g=r; }
  const headers=[]; for(let c=g.c1;c<=g.c2;c++) headers.push(String(wb.getValue(sheet,g.r1,c)??""));
  const rows=[];
  for(let r=g.r1+1;r<=g.r2;r++){ const o=[]; let any=false; for(let c=g.c1;c<=g.c2;c++){ const v=wb.getValue(sheet,r,c); if(v!=null&&v!=="") any=true; o.push(v); } if(any) rows.push(o); }

function pivotFields(wb,pv){ const s=pivotSource(wb,pv); if(!s) return []; const f=s.headers.slice(); (pv.calc||[]).forEach(c=>f.push(c.name)); return f; }
function fieldIsNumeric(src,i){ return src.rows.length>0 && src.rows.every(r=>r[i]==null||typeof r[i]==="number"); }
function evalCalcField(wb,expr,sums){
  // remplace 'Champ' ou Champ par la somme du groupe
  let e=String(expr).replace(/^=/,"");
  const names=Object.keys(sums).sort((a,b)=>b.length-a.length);
  e=e.replace(/'([^']+)'/g,(m,n)=>{ const k=names.find(x=>x.toLowerCase()===n.toLowerCase()); return k!=null?"("+sums[k]+")":"0"; });
  names.forEach(n=>{ if(/^[A-Za-zÀ-ÿ_][\wÀ-ÿ]*$/.test(n)){ e=e.replace(new RegExp("(^|[^\\wÀ-ÿ'])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\wÀ-ÿ])","gi"),(m,p)=>p+"("+sums[n]+")"); } });

function computePivot(wb,pv){
  const src=pivotSource(wb,pv); if(!src) return null;

  const keyOf=(r,fs)=>fs.map(i=>r[i]==null?"(vide)":r[i]);
  const sortKeys=(a,b)=>{ for(let i=0;i<a.length;i++){ const c=cmpVals(a[i],b[i]); if(c) return c; } return 0; };
  const uniq=(fs)=>{ const m=new Map(); rows.forEach(r=>{ const k=keyOf(r,fs); m.set(JSON.stringify(k),k); }); return [...m.values()].sort(sortKeys); };

    const calc=(pv.calc||[]).find(c=>c.name.toLowerCase()===v.field.toLowerCase());
    if(calc){ const sums={}; src.headers.forEach((h,i)=>{ sums[h]=sel.reduce((a,r)=>a+(typeof r[i]==="number"?r[i]:0),0); }); return evalCalcField(wb,calc.formula,sums); }

function valueName(v){ return v.name||((AGG_LABEL[v.fn]||"Somme")+" de "+v.field); }

function cfStylesForSheet(wb,s){
  const out=new Map(); // "r,c" → {fc,bg,b,i,bar,icon}
  (s.cf||[]).forEach(rule=>{
    const ranges=String(rule.range).split(/[;,\s]+/).filter(Boolean).map(parseRangeStr).filter(Boolean);
    ranges.forEach(g=>{
      const vals=[]; for(let r=g.r1;r<=g.r2;r++) for(let c=g.c1;c<=g.c2;c++){ const v=wb.getValue(s.name,r,c); if(typeof v==="number") vals.push(v); }
      const mn=vals.length?Math.min(...vals):0, mx=vals.length?Math.max(...vals):0;
      const sorted=vals.slice().sort((a,b)=>a-b);
      const pctile=p=>{ if(!sorted.length) return 0; const k=(sorted.length-1)*p/100, lo=Math.floor(k), hi=Math.ceil(k); return sorted[lo]+(sorted[hi]-sorted[lo])*(k-lo); };
      const thr=(lv)=>{ if(lv.type==="num") return Number(lv.v); if(lv.type==="pct") return mn+(mx-mn)*Number(lv.v)/100; if(lv.type==="percentile") return pctile(Number(lv.v)); if(lv.type==="formula"){ try{ return num(scalar({wb},evalNode({wb,sheet:s.name},parseFormula(lv.v)))); }catch(e){ return 0; } } return Number(lv.v); };
      for(let r=g.r1;r<=g.r2;r++) for(let c=g.c1;c<=g.c2;c++){
        const key=r+","+c; const v=wb.getValue(s.name,r,c); let hit=false;
        const st=out.get(key)||{};
        switch(rule.type){
          case "cellIs":{ if(v==null||v==="") break; const a=cfVal(wb,s,rule.v1), b=cfVal(wb,s,rule.v2);
            const cv=cmpVals(v,a); hit={gt:cv>0,lt:cv<0,ge:cv>=0,le:cv<=0,eq:cv===0,ne:cv!==0,between:cmpVals(v,a)>=0&&cmpVals(v,b)<=0,notBetween:!(cmpVals(v,a)>=0&&cmpVals(v,b)<=0)}[rule.op]; break; }
          case "text": hit=typeof v==="string"&&v.toLowerCase().includes(String(rule.v1).toLowerCase()); break;
          case "expr":{ try{ const f=shiftFormula(rule.formula,r-g.r1,c-g.c1); const res=scalar({wb},evalNode({wb,sheet:s.name,cell:{r,c}},parseFormula(f))); hit=!isErr(res)&&truthy(res); }catch(e){ hit=false; } break; }
          case "top":{ if(typeof v!=="number") break; const n=Number(rule.n||10); const desc=sorted.slice().reverse(); const k=rule.pct?Math.max(1,Math.round(sorted.length*n/100)):n;
            hit=rule.bottom?v<=sorted[Math.min(k,sorted.length)-1]:v>=desc[Math.min(k,desc.length)-1]; break; }
          case "avg":{ if(typeof v!=="number") break; const avg=vals.reduce((a,b)=>a+b,0)/(vals.length||1); hit=rule.below?v<avg:v>avg; break; }
          case "dup":{ if(v==null||v==="") break; let cnt=0; for(let rr=g.r1;rr<=g.r2;rr++) for(let cc=g.c1;cc<=g.c2;cc++){ if(cmpVals(wb.getValue(s.name,rr,cc),v)===0) cnt++; } hit=rule.unique?cnt===1:cnt>1; break; }
          case "dataBar":{ if(typeof v!=="number") break; const lo=Math.min(0,mn), w=(mx-lo)||1; st.bar={pct:Math.max(0.04,(v-lo)/w),color:rule.bar.color,gradient:rule.bar.gradient!==false,border:rule.bar.border==="solid",borderColor:rule.bar.borderColor||rule.bar.color}; break; }
          case "colorScale":{ if(typeof v!=="number") break; const t=(mx-mn)?(v-mn)/(mx-mn):0.5; const cols=rule.colors||["#F8696B","#FFEB84","#63BE7B"]; st.bg=cols.length===2?mixHex(cols[0],cols[1],t):(t<0.5?mixHex(cols[0],cols[1],t*2):mixHex(cols[1],cols[2],(t-0.5)*2)); break; }
          case "iconSet":{ if(typeof v!=="number") break; const lv=rule.icons.levels; // levels[0] = icône la plus haute
            let chosen=null; for(let i=0;i<lv.length;i++){ const L=lv[i]; if(i===lv.length-1){ chosen=L.icon; break; } const t=thr(L); if(L.op===">"?v>t:v>=t){ chosen=L.icon; break; } }
            if(chosen&&chosen!=="none") st.icon=chosen; if(rule.icons.iconOnly) st.iconOnly=true; break; }
        }
        if(hit&&rule.fmt){ Object.assign(st,rule.fmt); }
        if(Object.keys(st).length) out.set(key,st);
      }
    });
  });
  return out;
}

/* --- styles de tableaux --- */
const TS_ACCENTS=[["#000000","#D9D9D9","#808080"],["#4472C4","#D9E1F2","#B4C6E7"],["#ED7D31","#FCE4D6","#F8CBAD"],["#A5A5A5","#EDEDED","#DBDBDB"],["#FFC000","#FFF2CC","#FFE699"],["#5B9BD5","#DDEBF7","#BDD7EE"],["#70AD47","#E2EFDA","#C6E0B4"]];
const TS_COLORNAMES=["Noir","Bleu","Orange","Gris","Or","Bleu clair","Vert"];
function tableStyleInfo(name){
  const m=/TableStyle(Light|Medium|Dark)(\d+)/.exec(name||"TableStyleMedium2")||["","Medium","2"];
  const fam=m[1], n=+m[2]; const acc=TS_ACCENTS[(n-1)%7]; const famFr={Light:"clair",Medium:"moyen",Dark:"foncé"}[fam];
  const label=TS_COLORNAMES[(n-1)%7]+", Style de tableau "+famFr+" "+n;
  if(fam==="Light") return {label,head:{bg:n<=7?"#FFFFFF":acc[0],fc:n<=7?"#000":"#fff",b:true,line:acc[0]},band:n>14?null:acc[1],bandAlt:"#FFFFFF",border:acc[0]};
  if(fam==="Dark") return {label,head:{bg:"#000000",fc:"#fff",b:true},band:acc[0],bandAlt:acc[2],fc:"#fff"};
  return {label,head:{bg:acc[0],fc:"#fff",b:true},band:acc[1],bandAlt:"#FFFFFF"};
}
function tableStyleThumb(name){
  const s=tableStyleInfo(name); let h=`<svg viewBox="0 0 40 30" width="40" height="30"><rect x="0.5" y="0.5" width="39" height="29" fill="#fff" stroke="#ccc"/>`;
  h+=`<rect x="1" y="1" width="38" height="6" fill="${s.head.bg}"/>`;
  for(let i=0;i<4;i++){ h+=`<rect x="1" y="${7+i*5.5}" width="38" height="5.5" fill="${i%2===0?(s.band||"#fff"):(s.bandAlt||"#fff")}"/>`; }
  if(s.head.line) h+=`<line x1="1" y1="7" x2="39" y2="7" stroke="${s.head.line}"/>`;
  return h+`</svg>`;
}
